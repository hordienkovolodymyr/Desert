<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ПІЩАНИЙ ЗЛОДІЙ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'Press Start 2P',monospace;}
#gc{position:relative;width:100vw;height:100vh;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;top:0;left:0;}
#menuCanvas{z-index:1;}
#cv{z-index:0;}

/* ── OVERLAYS ── */
#menuOverlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
#menuOverlay.active{pointer-events:all;}
.mt{color:#f5d87a;font-size:clamp(20px,5vw,36px);text-align:center;line-height:1.9;text-shadow:3px 3px 0 #000,0 0 30px #f5a62388;margin-bottom:10px;letter-spacing:3px;}
.ms{color:#e8d5a3cc;font-size:clamp(6px,1.4vw,9px);margin-bottom:36px;letter-spacing:4px;}
.mb{background:rgba(10,8,4,.75);border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.2vw,13px);padding:12px 26px;cursor:pointer;margin:6px;letter-spacing:1px;backdrop-filter:blur(2px);}
.mb:hover,.mb:focus{background:#f5a623;color:#0a0a0a;outline:none;}
.pd{color:#f5d87a;font-size:20px;margin:6px 0 18px;opacity:.6;letter-spacing:8px;}

/* ── SETTINGS PANEL ── */
#settingsPanel{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.sp-title{color:#f5a623;font-size:clamp(12px,3vw,20px);margin-bottom:10px;text-shadow:3px 3px 0 #000;}
.sp-row{display:flex;align-items:center;gap:16px;color:#e8d5a3;font-size:clamp(7px,1.6vw,10px);}
.sp-label{width:140px;text-align:right;}
.sp-val{color:#f5a623;min-width:60px;}
.sp-btn{background:transparent;border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:9px;padding:6px 10px;cursor:pointer;}
.sp-btn:hover{background:#f5a623;color:#000;}
.sp-ver{color:#555;font-size:7px;margin-top:20px;}

/* ── CONTROLS ── */
#controls{position:fixed;bottom:0;left:0;right:0;height:140px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px 20px;pointer-events:none;z-index:5;}
.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:4px;pointer-events:all;}
.bc{background:rgba(245,166,35,.15);border:2px solid rgba(245,166,35,.5);color:#f5a623;font-family:'Press Start 2P',monospace;font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.bc:active,.bc.pressed{background:rgba(245,166,35,.5);border-color:#f5a623;}
.bl{grid-column:1;grid-row:2;}.br{grid-column:3;grid-row:2;}
.be{grid-column:2;grid-row:1;opacity:0;pointer-events:none;}.be2{grid-column:2;grid-row:2;opacity:0;pointer-events:none;}
.bj{width:74px;height:74px;border-radius:50%;background:rgba(245,166,35,.15);border:3px solid rgba(245,166,35,.6);color:#f5a623;font-family:'Press Start 2P',monospace;font-size:10px;display:flex;align-items:center;justify-content:center;pointer-events:all;user-select:none;-webkit-user-select:none;flex-direction:column;gap:3px;}
.bj:active,.bj.pressed{background:rgba(245,166,35,.5);border-color:#f5a623;}

/* ── HUD ── */
#hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 15px;z-index:5;pointer-events:none;}
.hi{color:#f5a623;font-size:clamp(7px,1.8vw,10px);text-shadow:2px 2px 0 #000;}
#heartsHud{display:flex;gap:4px;align-items:center;}
#puHud{position:fixed;top:32px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;pointer-events:none;}
.pub{font-size:6px;padding:3px 5px;border-radius:2px;border:1px solid;white-space:nowrap;}
#biomeTag{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:7px;text-shadow:2px 2px 0 #000;z-index:5;pointer-events:none;opacity:.8;}
#caveHint{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);color:#f5a623;font-size:7px;text-shadow:2px 2px 0 #000;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}

/* ── GAME OVER ── */
#go{position:absolute;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;}
.got{color:#e33;font-size:clamp(18px,5vw,30px);text-shadow:4px 4px 0 #800;margin-bottom:28px;animation:blink .5s infinite;}

#cd{position:fixed;top:48px;left:50%;transform:translateX(-50%);color:#0f0;font-size:8px;z-index:20;text-shadow:0 0 10px #0f0;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}
#dmg{position:fixed;inset:0;background:rgba(255,0,0,.35);pointer-events:none;z-index:8;opacity:0;transition:opacity .15s;}
#bubble{position:fixed;inset:0;background:rgba(0,80,180,.15);pointer-events:none;z-index:4;display:none;}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div id="gc">
  <!-- BG canvas for menu art -->
  <canvas id="menuCanvas"></canvas>
  <!-- Game canvas -->
  <canvas id="cv"></canvas>

  <!-- MENU OVERLAY -->
  <div id="menuOverlay" class="active">
    <div class="mt" id="titleText">ПІЩАНИЙ<br>ЗЛОДІЙ</div>
    <div class="pd">▪ ▪ ▪ ▪ ▪</div>
    <div class="ms" id="subtitleText">DESERT THIEF • 1987</div>
    <button class="mb" id="startBtn">▶ <span id="lblPlay">ПОЧАТИ</span></button>
    <button class="mb" id="settingsBtn" style="font-size:clamp(8px,2vw,11px);border-color:#aaa;color:#aaa">⚙ <span id="lblSettings">НАЛАШТУВАННЯ</span></button>
  </div>

  <!-- SETTINGS PANEL -->
  <div id="settingsPanel">
    <div class="sp-title" id="lblSettingsTitle">НАЛАШТУВАННЯ</div>
    <div class="sp-row">
      <div class="sp-label" id="lblLang">Мова / Language</div>
      <button class="sp-btn" id="langBtn">🇺🇦 УКР</button>
    </div>
    <div class="sp-row">
      <div class="sp-label" id="lblSound">Звук</div>
      <button class="sp-btn" id="soundBtn">🔊 УВІМК</button>
    </div>
    <div class="sp-row">
      <div class="sp-label" id="lblMusic">Музика</div>
      <button class="sp-btn" id="musicBtn">🎵 УВІМК</button>
    </div>
    <button class="mb" id="settingsBackBtn" style="margin-top:20px">← <span id="lblBack">НАЗАД</span></button>
    <div class="sp-ver">DESERT THIEF v0.3.0 • 2025</div>
  </div>

  <!-- GAME OVER -->
  <div id="go">
    <div class="got" id="lblDead">ТИ ПОМЕР</div>
    <button class="mb" id="retryBtn">↺ <span id="lblRetry">ЗНОВУ</span></button>
    <button class="mb" id="menuBtn" style="margin-top:8px;font-size:10px;border-color:#888;color:#888">⌂ <span id="lblMenu">МЕНЮ</span></button>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <div id="heartsHud"></div>
    <div class="hi" id="ld">РІВЕНЬ 1</div>
    <div class="hi" id="sc">000000</div>
  </div>
  <div id="puHud"></div>
  <div id="biomeTag"></div>
  <div id="caveHint">▲ УВІЙТИ В ПЕЧЕРУ</div>
  <div id="cd"></div>
  <div id="dmg"></div>
  <div id="bubble"></div>

  <!-- CONTROLS -->
  <div id="controls" style="display:none">
    <div class="dpad">
      <div class="be"></div><div class="be2"></div>
      <div class="bc bl" id="bL">◀</div>
      <div class="bc br" id="bR">▶</div>
    </div>
    <div class="bj" id="bJ"><span>▲</span><span style="font-size:7px" id="lblJump">СТРИБ</span></div>
  </div>
</div>
<script>
// ══════════════════════════════════════════════
//  LOCALISATION
// ══════════════════════════════════════════════
const LANGS={
  uk:{
    play:'ПОЧАТИ',settings:'НАЛАШТУВАННЯ',settingsTitle:'НАЛАШТУВАННЯ',
    lang:'Мова / Language',sound:'Звук',music:'Музика',back:'НАЗАД',
    dead:'ТИ ПОМЕР',retry:'ЗНОВУ',menu:'МЕНЮ',jump:'СТРИБ',
    on:'УВІМК',off:'ВИМК',level:'РІВЕНЬ',
    swordPickup:'⚔ МЕЧ ПІДІБРАНО ⚔',
    speed:'★ ШВИДКІСТЬ ★',dj:'★ 2× СТРИБОК ★',shield:'★ ЩИТ ★',invis:'★ НЕВИДИМІСТЬ ★',
    heal:'❤ СЕРЦЕ ВІДНОВЛЕНО ❤',
    levelDone:'★ РІВЕНЬ ЗАВЕРШЕНО! ★',
    caveHint:'▲ УВІЙТИ В ПЕЧЕРУ',
    enterCave:'ПІДЗЕМЕЛЛЯ',
  },
  en:{
    play:'PLAY',settings:'SETTINGS',settingsTitle:'SETTINGS',
    lang:'Language / Мова',sound:'Sound',music:'Music',back:'BACK',
    dead:'YOU DIED',retry:'RETRY',menu:'MENU',jump:'JUMP',
    on:'ON',off:'OFF',level:'LEVEL',
    swordPickup:'⚔ SWORD PICKED UP ⚔',
    speed:'★ SPEED BOOST ★',dj:'★ DOUBLE JUMP ★',shield:'★ SHIELD ★',invis:'★ INVISIBLE ★',
    heal:'❤ HEART RESTORED ❤',
    levelDone:'★ LEVEL COMPLETE! ★',
    caveHint:'▲ ENTER CAVE',
    enterCave:'DUNGEON',
  }
};
let lang='uk';
function T(k){return LANGS[lang][k]||k;}
function applyLang(){
  document.getElementById('lblPlay').textContent=T('play');
  document.getElementById('lblSettings').textContent=T('settings');
  document.getElementById('lblSettingsTitle').textContent=T('settingsTitle');
  document.getElementById('lblLang').textContent=T('lang');
  document.getElementById('lblSound').textContent=T('sound');
  document.getElementById('lblMusic').textContent=T('music');
  document.getElementById('lblBack').textContent=T('back');
  document.getElementById('lblDead').textContent=T('dead');
  document.getElementById('lblRetry').textContent=T('retry');
  document.getElementById('lblMenu').textContent=T('menu');
  document.getElementById('lblJump').textContent=T('jump');
  document.getElementById('caveHint').textContent=T('caveHint');
  document.getElementById('langBtn').textContent=lang==='uk'?'🇺🇦 УКР':'🇬🇧 ENG';
  updateHUD();
}

// ══════════════════════════════════════════════
//  SETTINGS STATE
// ══════════════════════════════════════════════
let soundOn=true,musicOn=true;

document.getElementById('langBtn').addEventListener('click',()=>{
  lang=lang==='uk'?'en':'uk';applyLang();
});
document.getElementById('soundBtn').addEventListener('click',()=>{
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent=(soundOn?'🔊 ':'🔇 ')+(soundOn?T('on'):T('off'));
});
document.getElementById('musicBtn').addEventListener('click',()=>{
  musicOn=!musicOn;
  document.getElementById('musicBtn').textContent=(musicOn?'🎵 ':'🎵 ')+(musicOn?T('on'):T('off'));
  if(musicOn&&GS==='playing')startMusic();else stopMusic();
});
document.getElementById('settingsBtn').addEventListener('click',()=>{
  document.getElementById('settingsPanel').style.display='flex';
});
document.getElementById('settingsBackBtn').addEventListener('click',()=>{
  document.getElementById('settingsPanel').style.display='none';
});

// ══════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f,t,dur,v=.25,fe=null,d=0){
  if(!soundOn)return;
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type=t;o.frequency.setValueAtTime(f,a.currentTime+d);
    if(fe)o.frequency.exponentialRampToValueAtTime(fe,a.currentTime+d+dur);
    g.gain.setValueAtTime(v,a.currentTime+d);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+dur);
    o.start(a.currentTime+d);o.stop(a.currentTime+d+dur);
  }catch(e){}
}
const SFX={
  jump:()=>tone(200,'square',.09,.18,440),
  coin:()=>{tone(880,'square',.06,.18);tone(1200,'square',.07,.13,null,.06);},
  death:()=>{tone(300,'sawtooth',.06,.28,80);tone(80,'sawtooth',.2,.18,40,.06);},
  hit:()=>tone(180,'sawtooth',.1,.25,90),
  sword:()=>{tone(600,'square',.04,.13,200);tone(800,'sawtooth',.03,.05,null,.04);},
  kill:()=>{tone(150,'square',.05,.18,80);tone(300,'square',.04,.09,null,.05);},
  potion:()=>[0,.06,.12,.18].forEach((d,i)=>tone([400,500,600,800][i],'sine',.1,.18,null,d)),
  heal:()=>[0,.08,.16].forEach((d,i)=>tone([523,659,784][i],'sine',.2,.22,null,d)),
  win:()=>[[523,0],[659,.1],[784,.2],[1046,.3]].forEach(([f,d])=>tone(f,'square',.14,.22,null,d)),
  levelup:()=>[[262,0],[330,.09],[392,.18],[523,.27],[659,.36],[784,.45]].forEach(([f,d])=>tone(f,'square',.16,.24,null,d)),
  spear:()=>tone(380,'sawtooth',.05,.13,180),
  bubble:()=>tone(600,'sine',.12,.08,900),
  shark:()=>tone(100,'sawtooth',.08,.2,60),
  treasure:()=>[0,.07,.14,.21].forEach((d,i)=>tone([800,1000,1200,1600][i],'sine',.09,.22,null,d)),
  cave:()=>{tone(200,'sine',.3,.15,100);tone(150,'sine',.4,.1,80,.1);},
};

let bgInt=null;
const AMB_NOTES=[262,294,349,392,440,392,349,330];
let ambIdx=0,ambTimer=0;
function bgTick(){
  if(!musicOn)return;
  try{
    [[55,.035],[73,.025]].forEach(([f,v])=>tone(f,'sine',.5,v));
    ambTimer++;
    if(ambTimer>=4){ambTimer=0;tone(AMB_NOTES[ambIdx%AMB_NOTES.length],'triangle',.35,.055);ambIdx++;}
  }catch(e){}
}
function startMusic(){if(!bgInt)bgInt=setInterval(bgTick,700);}
function stopMusic(){clearInterval(bgInt);bgInt=null;ambIdx=0;ambTimer=0;}

// ══════════════════════════════════════════════
//  MENU BACKGROUND ART  (castle window)
// ══════════════════════════════════════════════
const menuCv=document.getElementById('menuCanvas');
const mctx=menuCv.getContext('2d');
function resizeMenuCanvas(){menuCv.width=window.innerWidth;menuCv.height=window.innerHeight;}
resizeMenuCanvas();
window.addEventListener('resize',resizeMenuCanvas);

function drawMenuArt(){
  const W=menuCv.width,H=menuCv.height;
  mctx.clearRect(0,0,W,H);

  // Sky gradient through window
  const sky=mctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a2a40');sky.addColorStop(.4,'#4a7a9b');sky.addColorStop(1,'#7ab8d0');
  mctx.fillStyle=sky;mctx.fillRect(0,0,W,H);

  // Rolling hills (pixel style)
  function hill(x,y,r,c){mctx.fillStyle=c;mctx.beginPath();mctx.ellipse(x,y,r,r*.45,0,Math.PI,0);mctx.fill();}
  hill(W*.15,H*.72,W*.3,'#2d5a2d');
  hill(W*.55,H*.68,W*.35,'#3a6e3a');
  hill(W*.85,H*.75,W*.25,'#2a5a2a');
  hill(W*.3,H*.78,W*.2,'#4a8a4a');
  hill(W*.7,H*.74,W*.28,'#3d7a3d');

  // River
  const rv=mctx.createLinearGradient(W*.4,0,W*.6,0);
  rv.addColorStop(0,'#2a6a9a');rv.addColorStop(.5,'#4a9abb');rv.addColorStop(1,'#2a6a9a');
  mctx.fillStyle=rv;
  mctx.beginPath();mctx.moveTo(W*.42,H*.62);mctx.bezierCurveTo(W*.45,H*.7,W*.5,H*.75,W*.48,H*.9);
  mctx.bezierCurveTo(W*.52,H*.9,W*.54,H*.75,W*.56,H*.62);mctx.closePath();mctx.fill();

  // Tower
  const tw=W*.07,th=H*.22,tx=W*.28,ty=H*.52;
  mctx.fillStyle='#8a7a5a';mctx.fillRect(tx,ty,tw,th);
  mctx.fillStyle='#7a6a4a';
  for(let i=0;i<tw;i+=8)for(let j=0;j<th;j+=8){
    if((Math.floor(i/8)+Math.floor(j/8))%2===0){mctx.fillStyle='#6a5a3a';mctx.fillRect(tx+i,ty+j,4,4);}
  }
  mctx.fillStyle='#5a4a2a';mctx.fillRect(tx+tw*.3,ty+th*.7,tw*.4,th*.3);
  // Battlements
  for(let i=0;i<3;i++){mctx.fillStyle='#8a7a5a';mctx.fillRect(tx+i*(tw/3),ty-H*.02,tw/3-.5*4,H*.02);}

  // Trees (pixel style)
  function tree(x,y,h){
    mctx.fillStyle='#1a3a1a';mctx.fillRect(x-3,y,6,h*.25);
    mctx.fillStyle='#2a5a2a';mctx.fillRect(x-12,y-h*.4,24,h*.5);
    mctx.fillStyle='#3a7a3a';mctx.fillRect(x-8,y-h*.7,16,h*.4);
    mctx.fillStyle='#4a9a4a';mctx.fillRect(x-5,y-h*.95,10,h*.35);
  }
  tree(W*.08,H*.65,H*.18);tree(W*.18,H*.6,H*.22);tree(W*.22,H*.64,H*.15);
  tree(W*.72,H*.6,H*.2);tree(W*.78,H*.63,H*.17);tree(W*.88,H*.66,H*.14);

  // ── Castle wall (stone blocks) ──
  const wallC='#2a2a4a',wallHL='#3a3a6a',wallSH='#1a1a2a';
  const bw=Math.round(W*.075),bh=Math.round(H*.06);

  function stoneWall(x,y,w,h){
    mctx.fillStyle=wallC;mctx.fillRect(x,y,w,h);
    let row=0;
    for(let cy=y;cy<y+h;cy+=bh,row++){
      const offset=row%2===0?0:bw/2;
      for(let cx2=x-offset;cx2<x+w;cx2+=bw){
        mctx.strokeStyle=wallSH;mctx.lineWidth=2;
        mctx.strokeRect(Math.max(x,cx2)+1,cy+1,Math.min(bw-2,x+w-Math.max(x,cx2)-2),bh-2);
        mctx.fillStyle=wallHL;mctx.fillRect(Math.max(x,cx2)+2,cy+2,6,2);
      }
    }
  }

  const lw=Math.round(W*.18),rw=Math.round(W*.18);
  const wallY=Math.round(H*.05),wallH=Math.round(H*.9);
  stoneWall(0,wallY,lw,wallH);
  stoneWall(W-rw,wallY,rw,wallH);

  // Floor
  mctx.fillStyle='#3a3020';mctx.fillRect(0,H*.88,W,H*.12);
  for(let i=0;i<W;i+=bw*.8){
    mctx.strokeStyle='#2a2010';mctx.lineWidth=1.5;mctx.beginPath();mctx.moveTo(i,H*.88);mctx.lineTo(i+bw*.4,H);mctx.stroke();
  }
  mctx.strokeStyle='#2a2010';mctx.lineWidth=1.5;
  for(let j=H*.88;j<H;j+=bh*.7){mctx.beginPath();mctx.moveTo(0,j);mctx.lineTo(W,j);mctx.stroke();}

  // ── Gothic arch window ──
  const aw=Math.round(W*.52),ah=Math.round(H*.78);
  const ax=Math.round((W-aw)/2),ay=Math.round(H*.06);

  // Arch stone frame
  mctx.fillStyle='#b8965a';
  // Outer arch
  mctx.beginPath();
  mctx.moveTo(ax-16,ay+ah);
  mctx.lineTo(ax-16,ay+ah*.45);
  mctx.bezierCurveTo(ax-16,ay,ax+aw/2,ay-20,ax+aw/2,ay-30);
  mctx.bezierCurveTo(ax+aw/2,ay-20,ax+aw+16,ay,ax+aw+16,ay+ah*.45);
  mctx.lineTo(ax+aw+16,ay+ah);
  mctx.closePath();mctx.fill();

  // Inner window reveal (darker frame)
  mctx.fillStyle='#9a7a40';
  mctx.beginPath();
  mctx.moveTo(ax,ay+ah);
  mctx.lineTo(ax,ay+ah*.45);
  mctx.bezierCurveTo(ax,ay+10,ax+aw/2,ay-10,ax+aw/2,ay-18);
  mctx.bezierCurveTo(ax+aw/2,ay-10,ax+aw,ay+10,ax+aw,ay+ah*.45);
  mctx.lineTo(ax+aw,ay+ah);
  mctx.closePath();mctx.fill();

  // Clip to window interior
  mctx.save();
  mctx.beginPath();
  mctx.moveTo(ax+12,ay+ah);
  mctx.lineTo(ax+12,ay+ah*.46);
  mctx.bezierCurveTo(ax+12,ay+18,ax+aw/2,ay+2,ax+aw/2,ay-6);
  mctx.bezierCurveTo(ax+aw/2,ay+2,ax+aw-12,ay+18,ax+aw-12,ay+ah*.46);
  mctx.lineTo(ax+aw-12,ay+ah);
  mctx.closePath();mctx.clip();
  // Re-draw sky+hills inside window
  mctx.drawImage(menuCv,0,0); // (draws the already-painted bg)
  mctx.restore();

  // Two interior columns
  const col1x=ax+aw*.33,col2x=ax+aw*.62;
  function column(cx2){
    mctx.fillStyle='#c8aa6a';mctx.fillRect(cx2-7,ay+ah*.2,14,ah*.76);
    // Fluting
    for(let i=0;i<6;i++){mctx.fillStyle='#a88a4a';mctx.fillRect(cx2-5+i*2,ay+ah*.2,1,ah*.76);}
    // Capital
    mctx.fillStyle='#d8ba7a';mctx.fillRect(cx2-12,ay+ah*.18,24,10);
    mctx.fillStyle='#b89a5a';mctx.fillRect(cx2-10,ay+ah*.18+10,20,6);
    // Base
    mctx.fillStyle='#d8ba7a';mctx.fillRect(cx2-12,ay+ah*.92,24,10);
  }
  column(col1x);column(col2x);

  // Gothic tracery at top (quatrefoil)
  function quatrefoil(cx2,cy,r){
    mctx.fillStyle='#b8965a';
    [[-r,0],[r,0],[0,-r],[0,r]].forEach(([dx,dy])=>{
      mctx.beginPath();mctx.arc(cx2+dx,cy+dy,r*.65,0,Math.PI*2);mctx.fill();
    });
    mctx.fillStyle='#7ab8d0';
    [[-r,0],[r,0],[0,-r],[0,r]].forEach(([dx,dy])=>{
      mctx.beginPath();mctx.arc(cx2+dx,cy+dy,r*.5,0,Math.PI*2);mctx.fill();
    });
    mctx.fillStyle='#b8965a';mctx.beginPath();mctx.arc(cx2,cy,r*.28,0,Math.PI*2);mctx.fill();
  }
  quatrefoil(ax+aw/2,ay+10,W*.045);

  // Sub-arches between columns
  function subArch(x1,x2,baseY,topY){
    mctx.strokeStyle='#b8965a';mctx.lineWidth=8;
    mctx.beginPath();
    const mx=(x1+x2)/2;
    mctx.moveTo(x1,baseY);mctx.lineTo(x1,topY+20);
    mctx.bezierCurveTo(x1,topY,mx,topY-12,mx,topY-18);
    mctx.bezierCurveTo(mx,topY-12,x2,topY,x2,topY+20);
    mctx.lineTo(x2,baseY);mctx.stroke();
  }
  subArch(ax+14,col1x-7,ay+ah*.9,ay+ah*.28);
  subArch(col1x+7,col2x-7,ay+ah*.9,ay+ah*.22);
  subArch(col2x+7,ax+aw-14,ay+ah*.9,ay+ah*.28);

  // Vines creeping in
  mctx.strokeStyle='#2a5a2a';mctx.lineWidth=3;
  mctx.beginPath();mctx.moveTo(ax+20,ay+ah*.3);
  mctx.bezierCurveTo(ax+40,ay+ah*.35,ax+35,ay+ah*.5,ax+28,ay+ah*.6);mctx.stroke();
  mctx.strokeStyle='#3a7a3a';mctx.lineWidth=2;
  mctx.beginPath();mctx.moveTo(ax+22,ay+ah*.35);
  mctx.bezierCurveTo(ax+10,ay+ah*.4,ax+8,ay+ah*.45,ax+18,ay+ah*.42);mctx.stroke();

  // Dark vignette at edges
  const vig=mctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.75);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,.6)');
  mctx.fillStyle=vig;mctx.fillRect(0,0,W,H);

  // Pixel grain overlay
  mctx.fillStyle='rgba(0,0,0,.04)';
  for(let i=0;i<W;i+=2)for(let j=0;j<H;j+=2){
    if(Math.random()<.3)mctx.fillRect(i,j,2,2);
  }
}

const TILE=36,GRAV=.55,JF=-13,SPD=3.8;
const LEVEL_W=4800,MAX_LIVES=5;

// ══════════════════════════════════════════════
//  BIOMES
// ══════════════════════════════════════════════
const BIOMES=[
  {id:'desert',name:'ПУСТЕЛЯ',bg:['#0d0a1a','#1a0d2e'],plat:'#4a3f6b',platTop:'#c8952a',stars:true,snow:false,water:false,cave:false},
  {id:'winter',name:'ЗИМА ❄',bg:['#0a1520','#152535'],plat:'#334455',platTop:'#ddeeff',stars:true,snow:true,water:false,cave:false},
  {id:'cave',  name:'ПЕЧЕРА 🕳',bg:['#050508','#0a0a10'],plat:'#2a1f3a',platTop:'#6a5a7a',stars:false,snow:false,water:false,cave:true},
  {id:'water', name:'ПІДВОДНИЙ 🌊',bg:['#001530','#002550'],plat:'#0a3050',platTop:'#00aadd',stars:false,snow:false,water:true,cave:false},
  {id:'forest',name:'ЛІС 🌲',bg:['#061208','#0a2010'],plat:'#2a4a1a',platTop:'#5a9a2a',stars:true,snow:false,water:false,cave:false},
];

// ══════════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════════
let GS='menu',lives=3,maxLives=3,score=0,levelNum=1;
let PU={speed:0,doubleJump:0,shield:0,invis:0};
let hasSword=false,swordSwing=0;
let tick=0,camX=0;
const keys={left:false,right:false,jump:false};
let jumpPressed=false;
let biome=BIOMES[0];
let snowflakes=[],bubbles=[],leaves=[];
let platforms=[],spikes=[],coins=[],potions=[],swordItem=null,doorObj=null;
let enemies=[],projectiles=[],player={};
let caveEntrance=null,nearCave=false;
let inCaveLevel=false;

function rnd(a,b){return a+Math.random()*(b-a);}
function rndInt(a,b){return Math.floor(rnd(a,b+1));}

// ══════════════════════════════════════════════
//  HEARTS HUD
// ══════════════════════════════════════════════
function updateHeartsHUD(){
  const el=document.getElementById('heartsHud');
  el.innerHTML='';
  for(let i=0;i<maxLives;i++){
    const d=document.createElement('span');
    d.style.cssText=`font-size:clamp(10px,2.5vw,16px);text-shadow:1px 1px 0 #000;transition:opacity .3s;`;
    if(i<lives){d.textContent='❤';d.style.color='#ff4444';}
    else{d.textContent='❤';d.style.color='#444';d.style.opacity='.45';}
    el.appendChild(d);
  }
}
function updateHUD(){
  updateHeartsHUD();
  document.getElementById('sc').textContent=String(score).padStart(6,'0');
  document.getElementById('ld').textContent=T('level')+' '+levelNum;
}

// ══════════════════════════════════════════════
//  LEVEL GENERATION
// ══════════════════════════════════════════════
function genLevel(forceBiomeId){
  const PH=cv.height-150;
  if(forceBiomeId){biome=BIOMES.find(b=>b.id===forceBiomeId)||BIOMES[0];}
  else{biome=BIOMES[(levelNum-1)%BIOMES.length];}
  document.getElementById('biomeTag').textContent=biome.name;
  document.getElementById('bubble').style.display=biome.water?'block':'none';
  inCaveLevel=biome.id==='cave';

  platforms=[];spikes=[];coins=[];potions=[];enemies=[];projectiles=[];
  swordItem=null;caveEntrance=null;nearCave=false;

  snowflakes=biome.snow?Array.from({length:60},()=>({x:rnd(0,LEVEL_W),y:rnd(0,PH),spd:rnd(.5,2),r:rnd(2,5)})):[];
  bubbles=biome.water?Array.from({length:30},()=>({x:rnd(0,LEVEL_W),y:rnd(PH*.2,PH),spd:rnd(.3,1),r:rnd(3,9),phase:rnd(0,6.28)})):[];
  leaves=biome.id==='forest'?Array.from({length:50},()=>({x:rnd(0,LEVEL_W),y:rnd(0,PH),spd:rnd(.4,1.2),r:rnd(3,7),phase:rnd(0,6.28),col:['#2a7a2a','#4a9a2a','#3a8a1a','#6aaa3a'][rndInt(0,3)]})):[];

  // Ground
  platforms.push({x:0,y:PH-TILE,w:LEVEL_W,h:TILE,ground:true});

  // Platforms procedural
  let cx=200;
  while(cx<LEVEL_W-300){
    const pw=rnd(90,210),py=PH-TILE*rnd(2.5,7.5);
    platforms.push({x:cx,y:py,w:pw,h:TILE*.5,ground:false});
    cx+=pw+rnd(70,200);
  }

  // Spikes
  if(!biome.water){
    for(let i=0;i<9;i++){spikes.push({x:rnd(300,LEVEL_W-400),y:PH-TILE-20,w:24,h:20});}
  }

  // Coins on platforms
  for(let i=0;i<10;i++){
    const pl=platforms[rndInt(1,platforms.length-1)];
    coins.push({x:pl.x+rnd(12,pl.w-12),y:pl.y-22,r:9,collected:false});
  }
  for(let i=0;i<4;i++)coins.push({x:rnd(200,LEVEL_W-200),y:PH-TILE-22,r:9,collected:false});

  // Potions — 4 types + 1 RED (heal)
  const potDefs=[
    {type:'speed',    color:'#ffaa00',label:'SPD'},
    {type:'doubleJump',color:'#00aaff',label:'2×↑'},
    {type:'shield',   color:'#00ffaa',label:'SHD'},
    {type:'invis',    color:'#cc88ff',label:'INV'},
    {type:'heal',     color:'#ff3333',label:'❤'},
  ];
  potDefs.forEach((pt,i)=>{
    const pl=platforms[rndInt(1,Math.min(i*3+3,platforms.length-1))];
    potions.push({x:pl.x+pl.w*.45,y:pl.y-30,...pt,collected:false});
  });

  // Sword
  if(!hasSword){
    const pl=platforms[rndInt(1,3)];
    swordItem={x:pl.x+pl.w*.4,y:pl.y-24,w:30,h:14,collected:false};
  }

  // Cave entrance on desert/winter/forest levels
  if(!inCaveLevel&&biome.id!=='water'){
    caveEntrance={x:LEVEL_W*.42,y:PH-TILE-76,w:54,h:76};
  }

  // Door at end
  doorObj={x:LEVEL_W-160,y:PH-TILE-TILE*1.3,w:TILE*.95,h:TILE*1.3,open:false};

  // Enemies
  if(biome.water){
    for(let i=0;i<3;i++){
      const sy=rnd(PH*.25,PH*.7);
      enemies.push({type:'shark',x:rnd(400,LEVEL_W-400),y:sy,baseY:sy,
        vx:rnd(1,2.2)*(Math.random()>.5?1:-1),phase:rnd(0,6.28),
        hp:2,dead:false,deadTimer:0,w:55,h:24});
    }
    for(let i=0;i<4;i++){
      const pl=platforms[rndInt(1,platforms.length-1)];
      coins.push({x:pl.x+pl.w*.5,y:pl.y-16,r:13,collected:false,treasure:true});
    }
  } else if(biome.id==='cave'){
    // Cave bats instead of pteros, more guards
    for(let i=0;i<4;i++){
      const by=rnd(PH*.35,PH*.7);
      enemies.push({type:'ptero',x:rnd(300,LEVEL_W-300),y:by,baseY:by,
        vx:rnd(1,1.8)*(i%2?1:-1),phase:rnd(0,6),
        hp:1,dead:false,deadTimer:0,w:32,h:18});
    }
    for(let i=0;i<3;i++){
      const pl=platforms[rndInt(2,platforms.length-2)];
      enemies.push({type:'guard',x:pl.x+20,y:pl.y-40,
        vx:.65,facing:1,hp:2,dead:false,deadTimer:0,w:20,h:40,
        shootTimer:100+i*30,walkDir:1,walkTimer:0,startX:pl.x+20,range:pl.w-40});
    }
  } else {
    // Pteros fly at 55–70% height
    const ptY=PH*.6;
    for(let i=0;i<2;i++){
      enemies.push({type:'ptero',x:rnd(300,LEVEL_W-300),y:ptY,baseY:ptY,
        vx:rnd(.9,1.6)*(i%2?1:-1),phase:rnd(0,6),
        hp:1,dead:false,deadTimer:0,w:40,h:22});
    }
    for(let i=0;i<3;i++){
      const pl=platforms[rndInt(2,platforms.length-2)];
      enemies.push({type:'guard',x:pl.x+20,y:pl.y-40,
        vx:.7,facing:1,hp:2,dead:false,deadTimer:0,w:20,h:40,
        shootTimer:120+i*40,walkDir:1,walkTimer:0,startX:pl.x+20,range:pl.w-40});
    }
  }

  player={x:60,y:PH-TILE-52,w:22,h:32,vx:0,vy:0,
    onGround:false,facing:1,frame:0,frameTimer:0,
    dead:false,deathTimer:0,invincible:0,jumpsLeft:1};
  camX=0;
}

// ══════════════════════════════════════════════
//  CAMERA
// ══════════════════════════════════════════════
function getCamX(){
  return Math.max(0,Math.min(LEVEL_W-cv.width,player.x-cv.width*.35));
}

// ══════════════════════════════════════════════
//  COLLISION
// ══════════════════════════════════════════════
function colRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// ══════════════════════════════════════════════
//  PLAYER UPDATE
// ══════════════════════════════════════════════
function updatePlayer(){
  const p=player,PH=cv.height-150;
  if(p.dead){p.deathTimer--;p.vy+=GRAV;p.y+=p.vy;if(p.deathTimer<=0)triggerDeath();return;}
  if(p.invincible>0)p.invincible--;

  const spd=PU.speed>0?SPD*1.75:SPD;
  if(keys.left){p.vx=-spd;p.facing=-1;}
  else if(keys.right){p.vx=spd;p.facing=1;}
  else p.vx*=.78;

  if(biome.water){p.vx*=.72;p.vy*=.84;}

  const maxJ=PU.doubleJump>0?2:1;
  if((keys.jump||jumpPressed)&&p.jumpsLeft>0){
    p.vy=biome.water?JF*.6:JF;
    p.jumpsLeft--;p.onGround=false;SFX.jump();
    if(biome.water)SFX.bubble();
  }
  jumpPressed=false;

  p.vy+=biome.water?GRAV*.28:GRAV;
  if(biome.water&&p.vy>1.8)p.vy=1.8;
  p.x+=p.vx;p.y+=p.vy;
  p.x=Math.max(0,Math.min(LEVEL_W-p.w,p.x));

  p.onGround=false;
  for(const pl of platforms){
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h+Math.abs(p.vy)+2&&p.vy>=0){
      p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.jumpsLeft=maxJ;
    }
  }
  if(p.y>PH+100){startDeath();return;}

  // Spike & projectile hits → lose ONE life
  if(!window.godMode&&p.invincible<=0){
    for(const s of spikes){
      if(p.x+p.w-5>s.x&&p.x+5<s.x+s.w&&p.y+p.h>s.y){takeHit();return;}
    }
    for(const pr of projectiles){
      if(!pr.dead&&colRect(p,{x:pr.x-5,y:pr.y-5,w:10,h:10})){
        pr.dead=true;
        if(PU.shield){PU.shield=0;updatePUHUD();flashDmg();SFX.hit();p.invincible=60;}
        else{takeHit();return;}
      }
    }
  }

  // Coins
  for(const c of coins){
    if(!c.collected&&Math.hypot(p.x+p.w/2-c.x,p.y+p.h/2-c.y)<c.r+14){
      c.collected=true;score+=c.treasure?300:100;updateHUD();
      c.treasure?SFX.treasure():SFX.coin();
    }
  }

  // Sword
  if(swordItem&&!swordItem.collected&&colRect(p,swordItem)){
    swordItem.collected=true;hasSword=true;showCD(T('swordPickup'));SFX.win();
  }

  // Potions
  for(const pt of potions){
    if(!pt.collected&&colRect(p,{x:pt.x-10,y:pt.y-16,w:20,h:32})){
      pt.collected=true;
      if(pt.type==='heal'){
        if(lives<maxLives){lives++;updateHUD();showCD(T('heal'));SFX.heal();}
      } else {
        PU[pt.type]=600;updatePUHUD();SFX.potion();
        const n={speed:T('speed'),doubleJump:T('dj'),shield:T('shield'),invis:T('invis')};
        showCD(n[pt.type]);
      }
    }
  }

  // Cave entrance
  nearCave=false;
  if(caveEntrance&&!inCaveLevel){
    const dist=Math.abs(p.x+p.w/2-(caveEntrance.x+caveEntrance.w/2));
    if(dist<60&&p.y+p.h>caveEntrance.y){
      nearCave=true;
      if(keys.jump&&p.onGround){
        // Enter cave!
        SFX.cave();showCD(T('enterCave'));
        setTimeout(()=>{inCaveLevel=true;genLevel('cave');},400);
        return;
      }
    }
  }
  document.getElementById('caveHint').style.opacity=nearCave?'1':'0';

  // Door
  doorObj.open=coins.every(c=>c.collected);
  if(doorObj.open&&colRect(p,doorObj)){
    score+=500;updateHUD();SFX.levelup();showCD(T('levelDone'));
    setTimeout(()=>{levelNum++;updateHUD();genLevel();},1400);
  }

  // Sword auto-attack
  if(hasSword){
    for(const e of enemies){
      if(e.dead)continue;
      const dx=Math.abs(p.x+p.w/2-(e.x+e.w/2)),dy=Math.abs(p.y+p.h/2-(e.y+e.h/2));
      if(dx<52&&dy<e.h){swordSwing=12;e.hp--;SFX.sword();if(e.hp<=0){e.dead=true;e.deadTimer=30;score+=200;updateHUD();SFX.kill();}}
    }
  }
  if(swordSwing>0)swordSwing--;
  Object.keys(PU).forEach(k=>{if(PU[k]>0){PU[k]--;if(PU[k]===0)updatePUHUD();}});
  p.frameTimer++;if(p.frameTimer>8){p.frame=(p.frame+1)%2;p.frameTimer=0;}
}

function takeHit(){
  if(window.godMode)return;
  lives--;updateHUD();flashDmg();SFX.hit();
  if(lives<=0){startDeath();}
  else{player.invincible=90;} // brief invincibility after hit
}

function updateEnemies(){
  const PH=cv.height-150;
  for(const e of enemies){
    if(e.dead){e.deadTimer--;continue;}
    if(e.type==='ptero'){
      e.phase+=.034;e.x+=e.vx;
      e.y=e.baseY+Math.sin(e.phase)*32;
      if(e.x<-50||e.x>LEVEL_W+50)e.x=e.vx>0?-50:LEVEL_W+50;
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis===0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(PU.shield){PU.shield=0;updatePUHUD();flashDmg();SFX.hit();player.invincible=60;}
        else takeHit();
      }
    }
    if(e.type==='guard'){
      e.x+=e.vx*e.walkDir;e.walkTimer++;
      if(e.walkTimer>70){e.walkDir*=-1;e.walkTimer=0;}
      e.facing=player.x>e.x?1:-1;
      e.shootTimer--;
      if(e.shootTimer<=0){
        e.shootTimer=140+Math.random()*80;
        const dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy)||1;
        if(dist<440){projectiles.push({x:e.x+e.w/2,y:e.y+e.h*.4,vx:dx/dist*4,vy:dy/dist*2.5,dead:false});SFX.spear();}
      }
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis===0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(PU.shield){PU.shield=0;updatePUHUD();flashDmg();SFX.hit();player.invincible=60;}
        else takeHit();
      }
    }
    if(e.type==='shark'){
      e.phase+=.024;e.x+=e.vx;
      e.y=e.baseY+Math.sin(e.phase)*28;
      if(e.x<-60||e.x>LEVEL_W+60)e.x=e.vx>0?-60:LEVEL_W+60;
      if(!window.godMode&&player.invincible<=0&&!player.dead&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(PU.shield){PU.shield=0;updatePUHUD();flashDmg();SFX.shark();player.invincible=80;}
        else takeHit();
      }
    }
  }
  for(const pr of projectiles){
    if(pr.dead)continue;
    pr.x+=pr.vx;pr.y+=pr.vy;pr.vy+=.12;
    if(pr.x<0||pr.x>LEVEL_W||pr.y>cv.height-150)pr.dead=true;
  }
  for(const s of snowflakes){s.y+=s.spd;if(s.y>cv.height-150)s.y=-5;}
  for(const b of bubbles){b.y-=b.spd;b.x+=Math.sin(tick*.04+b.phase)*.5;if(b.y<0)b.y=cv.height-150;}
  for(const l of leaves){l.y+=l.spd*.5;l.x+=Math.sin(tick*.03+l.phase);if(l.y>cv.height-150)l.y=-8;}
}

function startDeath(){
  if(window.godMode)return;
  player.dead=true;player.deathTimer=50;player.vy=-9;player.vx=0;SFX.death();flashDmg();
}
function triggerDeath(){
  if(lives>0)return; // takeHit already decremented
  GS='dead';stopMusic();
  document.getElementById('go').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('puHud').innerHTML='';
  document.getElementById('caveHint').style.opacity='0';
}
function flashDmg(){const e=document.getElementById('dmg');e.style.opacity=1;setTimeout(()=>e.style.opacity=0,160);}
function showCD(m){const e=document.getElementById('cd');e.textContent=m;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2600);}

// ══════════════════════════════════════════════
//  DRAW HELPERS
// ══════════════════════════════════════════════
function drawBg(){
  const W=cv.width,H=cv.height;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,biome.bg[0]);g.addColorStop(1,biome.bg[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Forest trees in bg
  if(biome.id==='forest'){
    for(let i=0;i<12;i++){
      const tx=((i*380+100)-camX*.2)%W;
      ctx.fillStyle='#0a2a0a';ctx.fillRect(tx-5,H*.3,10,H*.55);
      ctx.fillStyle='#1a3a1a';ctx.beginPath();ctx.moveTo(tx,H*.1);ctx.lineTo(tx-22,H*.38);ctx.lineTo(tx+22,H*.38);ctx.fill();
      ctx.fillStyle='#0d2a0d';ctx.beginPath();ctx.moveTo(tx,H*.2);ctx.lineTo(tx-18,H*.46);ctx.lineTo(tx+18,H*.46);ctx.fill();
    }
  }
  // Cave stalactites
  if(biome.id==='cave'){
    ctx.fillStyle='#1a0f2a';
    for(let i=0;i<20;i++){
      const sx=((i*240+50)-camX*.5)%(W+200)-50;
      const sh=30+Math.sin(i*1.7)*20;
      ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx-10,sh);ctx.lineTo(sx+10,sh);ctx.fill();
    }
  }
}

function drawStars(cx){
  if(!biome.stars)return;
  for(let i=0;i<60;i++){
    const sx=((i*137+800)%LEVEL_W)-cx;
    if(sx<-5||sx>cv.width+5)continue;
    const sy=(i*97)%(cv.height*.5);
    const b=(Math.sin(tick*.03+i)+1)*.5;
    ctx.fillStyle=`rgba(255,255,255,${b*.8})`;ctx.fillRect(sx,sy,1.5,1.5);
  }
}
function drawSnow(cx){
  if(!biome.snow)return;
  ctx.fillStyle='rgba(220,240,255,.75)';
  for(const s of snowflakes){const sx=s.x-cx;if(sx<-5||sx>cv.width+5)continue;ctx.beginPath();ctx.arc(sx,s.y,s.r,0,Math.PI*2);ctx.fill();}
}
function drawLeaves(cx){
  if(biome.id!=='forest')return;
  for(const l of leaves){const lx=l.x-cx;if(lx<-10||lx>cv.width+10)continue;ctx.fillStyle=l.col;ctx.beginPath();ctx.arc(lx,l.y,l.r,0,Math.PI*2);ctx.fill();}
}
function drawBubbles(cx){
  if(!biome.water)return;
  ctx.strokeStyle='rgba(100,200,255,.45)';ctx.lineWidth=1.5;
  for(const b of bubbles){const bx=b.x-cx;if(bx<-10||bx>cv.width+10)continue;ctx.beginPath();ctx.arc(bx,b.y,b.r,0,Math.PI*2);ctx.stroke();}
}

function drawPlatforms(cx){
  for(const p of platforms){
    const px=p.x-cx;if(px+p.w<-5||px>cv.width+5)continue;
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(px+4,p.y+4,p.w,p.h);
    ctx.fillStyle=biome.plat;ctx.fillRect(px,p.y,p.w,p.h);
    ctx.fillStyle=biome.platTop;ctx.fillRect(px,p.y,p.w,4);
    if(biome.snow){ctx.fillStyle='rgba(220,240,255,.6)';ctx.fillRect(px,p.y,p.w,6);}
    if(!biome.water){for(let i=0;i<p.w;i+=18){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(px+i,p.y+4,9,4);}}
  }
}
function drawSpikes(cx){
  for(const s of spikes){
    const sx=s.x-cx;if(sx+s.w<0||sx>cv.width)continue;
    ctx.fillStyle='#cc2200';ctx.beginPath();ctx.moveTo(sx,s.y+s.h);ctx.lineTo(sx+s.w/2,s.y);ctx.lineTo(sx+s.w,s.y+s.h);ctx.fill();
    ctx.fillStyle='#ff6644';ctx.beginPath();ctx.moveTo(sx+3,s.y+s.h);ctx.lineTo(sx+s.w/2,s.y+5);ctx.lineTo(sx+s.w/2+2,s.y+s.h);ctx.fill();
  }
}
function drawCoin(c,cx){
  if(c.collected)return;
  const x=c.x-cx,bob=Math.sin(tick*.06+c.x)*(c.treasure?4:3);
  ctx.save();ctx.translate(x,c.y+bob);
  if(c.treasure){
    ctx.fillStyle='#8b6318';ctx.fillRect(-13,-12,26,20);
    ctx.fillStyle='#c8952a';ctx.fillRect(-13,-12,26,9);
    ctx.fillStyle='#ffe066';ctx.fillRect(-4,-5,8,12);
    ctx.fillStyle='rgba(255,220,50,.28)';ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe066';ctx.font='6px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('!',0,-17);
  } else {
    const g=ctx.createRadialGradient(0,0,2,0,0,c.r+4);
    g.addColorStop(0,'rgba(255,224,100,.3)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,c.r+6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(-2,-2,c.r*.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawAmphora(pt,cx){
  if(pt.collected)return;
  const x=pt.x-cx,bob=Math.sin(tick*.07+pt.x)*3;
  ctx.save();ctx.translate(x,pt.y+bob);
  ctx.shadowColor=pt.color;ctx.shadowBlur=10;
  ctx.fillStyle=pt.color+'aa';ctx.fillRect(-3,-18,6,6); // neck
  ctx.fillStyle=pt.color;ctx.fillRect(-5,-14,10,3); // rim
  // Belly
  ctx.fillStyle=pt.color+'cc';
  ctx.beginPath();ctx.moveTo(-3,-11);ctx.bezierCurveTo(-13,-11,-13,8,-3,10);ctx.lineTo(3,10);ctx.bezierCurveTo(13,8,13,-11,3,-11);ctx.closePath();ctx.fill();
  // Shine
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.moveTo(-2,-9);ctx.bezierCurveTo(-7,-9,-7,0,-2,2);ctx.lineTo(-1,2);ctx.bezierCurveTo(-6,0,-6,-9,-1,-9);ctx.closePath();ctx.fill();
  // Handles
  ctx.strokeStyle=pt.color;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(-7,-4,4,Math.PI*.6,Math.PI*1.4,true);ctx.stroke();
  ctx.beginPath();ctx.arc(7,-4,4,-Math.PI*.4,Math.PI*.4,false);ctx.stroke();
  ctx.fillStyle=pt.color+'aa';ctx.fillRect(-4,10,8,4); // base
  const pulse=(Math.sin(tick*.09+pt.x)+1)*.5;
  ctx.globalAlpha=pulse*.25;ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(0,-2,16,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='5px "Press Start 2P"';ctx.textAlign='center';ctx.fillText(pt.label,0,-24);
  ctx.restore();
}

function drawSwordItem(cx){
  if(!swordItem||swordItem.collected)return;
  const x=swordItem.x-cx,bob=Math.sin(tick*.05)*3;
  ctx.save();ctx.translate(x,swordItem.y+bob);
  ctx.shadowColor='#80b8ff';ctx.shadowBlur=14;
  ctx.fillStyle='#c0d8ff';ctx.fillRect(-15,-4,30,8);
  ctx.fillStyle='#aaa';ctx.fillRect(-17,-5,6,10);
  ctx.fillStyle='#80b8ff';ctx.fillRect(13,-4,4,8);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(128,184,255,.26)';ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#80b8ff';ctx.font='6px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('МЕЧ',0,-15);
  ctx.restore();
}

function drawCaveEntrance(cx){
  if(!caveEntrance)return;
  const ce=caveEntrance,ex=ce.x-cx;
  if(ex+ce.w<-5||ex>cv.width+5)return;
  // Opening
  ctx.fillStyle='#050306';ctx.fillRect(ex,ce.y,ce.w,ce.h);
  // Pixel torch flicker inside
  const flicker=(Math.sin(tick*.18)*0.4+0.6);
  ctx.fillStyle=`rgba(255,140,0,${flicker*.3})`;ctx.fillRect(ex+4,ce.y+4,ce.w-8,ce.h-4);
  // Stone arch
  ctx.fillStyle='#5a4a6a';
  ctx.fillRect(ex-10,ce.y-8,ce.w+20,14);
  ctx.fillRect(ex-10,ce.y,10,ce.h);
  ctx.fillRect(ex+ce.w,ce.y,10,ce.h);
  // Arch detail
  ctx.fillStyle='#3a2a4a';
  for(let i=0;i<4;i++)ctx.fillRect(ex-10+i*4,ce.y-8,2,14);
  // Hint arrow if near
  if(nearCave){
    ctx.fillStyle=`rgba(245,166,35,${.5+Math.sin(tick*.15)*.5})`;
    ctx.font='14px "Press Start 2P"';ctx.textAlign='center';
    ctx.fillText('▲',ex+ce.w/2,ce.y-14);
  }
}

function drawDoor(cx){
  const d=doorObj,dx=d.x-cx;
  if(dx+d.w<0||dx>cv.width)return;
  ctx.fillStyle='#8b6318';ctx.fillRect(dx-5,d.y-5,d.w+10,d.h+5);
  ctx.fillStyle=d.open?'#003322':'#1a1a2e';ctx.fillRect(dx,d.y,d.w,d.h);
  if(d.open){
    const pulse=Math.sin(tick*.1)*.3+.7;
    ctx.fillStyle=`rgba(0,255,170,${pulse*.3})`;ctx.fillRect(dx,d.y,d.w,d.h);
    ctx.fillStyle='#00ffaa';ctx.fillRect(dx+2,d.y+2,d.w-4,2);
  }
  ctx.fillStyle='#4a3f6b';ctx.fillRect(dx,d.y,3,d.h);ctx.fillRect(dx+d.w-3,d.y,3,d.h);
  if(!d.open){ctx.fillStyle='#ffe066';ctx.fillRect(dx+d.w/2-4,d.y+d.h*.4,8,7);ctx.strokeStyle='#ffe066';ctx.lineWidth=2;ctx.beginPath();ctx.arc(dx+d.w/2,d.y+d.h*.4,4,Math.PI,0);ctx.stroke();}
  ctx.fillStyle=d.open?'#00ffaa':'#555';ctx.font='6px "Press Start 2P"';ctx.textAlign='center';
  ctx.fillText(d.open?T('level'):T('level'),dx+d.w/2,d.y-9);
  if(!d.open){ctx.fillStyle='#555';ctx.fillText('ЗБЕРИ',dx+d.w/2,d.y-9);ctx.fillText('МОНЕТИ',dx+d.w/2,d.y-18);}
  else{ctx.fillStyle='#00ffaa';ctx.fillText('ВИХІД',dx+d.w/2,d.y-9);}
}

function drawPtero(e,cx){
  if(e.dead&&e.deadTimer>0){ctx.fillStyle='rgba(150,50,200,.5)';ctx.fillRect(e.x-cx,e.y,e.w,e.h);return;}
  if(e.dead)return;
  const ex=e.x-cx;if(ex+e.w<-5||ex>cv.width+5)return;
  const flap=Math.sin(tick*.22)>0;
  ctx.save();ctx.translate(ex+e.w/2,e.y+e.h/2);
  if(biome.id==='cave'){ctx.fillStyle='#1a1a2a';}else{ctx.fillStyle='#5a3a7a';}
  if(flap){ctx.fillRect(-e.w/2,-9,e.w/2-4,11);ctx.fillRect(4,-9,e.w/2-4,11);}
  else{ctx.fillRect(-e.w/2,0,e.w/2-4,9);ctx.fillRect(4,0,e.w/2-4,9);}
  ctx.fillStyle=biome.id==='cave'?'#2a2a3a':'#7a4a9a';ctx.fillRect(-9,-7,18,13);ctx.fillRect(7,-9,11,11);
  ctx.fillStyle='#e8c070';ctx.fillRect(16,-5,9,4);
  ctx.fillStyle='#ff4444';ctx.fillRect(10,-7,3,3);
  ctx.restore();
}
function drawGuard(e,cx){
  if(e.dead&&e.deadTimer>0){ctx.fillStyle='rgba(50,150,50,.5)';ctx.fillRect(e.x-cx,e.y,e.w,e.h);return;}
  if(e.dead)return;
  const ex=e.x-cx;if(ex+e.w<-5||ex>cv.width+5)return;
  ctx.save();
  if(e.facing===-1){ctx.translate(ex+e.w,e.y);ctx.scale(-1,1);}else ctx.translate(ex,e.y);
  ctx.fillStyle='#2a4a2a';ctx.fillRect(1,28,7,12);ctx.fillRect(11,28,7,12);
  ctx.fillStyle='#3a5a3a';ctx.fillRect(0,10,e.w,20);
  ctx.fillStyle='#6aaa6a';ctx.fillRect(2,10,16,4);ctx.fillRect(2,26,16,4);
  ctx.fillStyle='#3a5a3a';ctx.fillRect(2,0,16,12);
  ctx.fillStyle='#6aaa6a';ctx.fillRect(1,0,18,5);
  ctx.fillStyle='#ff4444';ctx.fillRect(5,4,3,3);ctx.fillRect(11,4,3,3);
  ctx.fillStyle='#c8952a';ctx.fillRect(e.w,-4,4,e.h+4);
  ctx.fillStyle='#ccc';ctx.fillRect(e.w-1,-12,6,10);
  ctx.fillStyle='#300';ctx.fillRect(0,-10,e.w,4);
  ctx.fillStyle='#0f0';ctx.fillRect(0,-10,e.w*(e.hp/2),4);
  ctx.restore();
}
function drawShark(e,cx){
  if(e.dead&&e.deadTimer>0){ctx.fillStyle='rgba(0,150,200,.5)';ctx.fillRect(e.x-cx,e.y,e.w,e.h);return;}
  if(e.dead)return;
  const ex=e.x-cx;if(ex+e.w<-5||ex>cv.width+5)return;
  ctx.save();ctx.translate(ex+e.w/2,e.y+e.h/2);
  if(e.vx<0)ctx.scale(-1,1);
  ctx.fillStyle='#5588aa';ctx.beginPath();ctx.moveTo(-28,0);ctx.bezierCurveTo(-28,-11,28,-11,28,0);ctx.bezierCurveTo(28,11,-28,11,-28,0);ctx.fill();
  ctx.fillStyle='#446688';ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(-40,-13);ctx.lineTo(-40,13);ctx.closePath();ctx.fill();
  ctx.fillStyle='#446688';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(-6,-28);ctx.lineTo(12,-11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#aaccdd';ctx.beginPath();ctx.moveTo(-20,2);ctx.bezierCurveTo(-20,9,20,9,20,2);ctx.bezierCurveTo(20,-2,-20,-2,-20,2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(15,-3,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(16,-4,1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(12+i*4,9);ctx.lineTo(14+i*4,16);ctx.lineTo(16+i*4,9);ctx.fill();}
  ctx.fillStyle='#300';ctx.fillRect(-28,-20,e.w,4);ctx.fillStyle='#0af';ctx.fillRect(-28,-20,e.w*(e.hp/2),4);
  ctx.restore();
}
function drawProjectile(pr,cx){
  if(pr.dead)return;
  const x=pr.x-cx;if(x<-10||x>cv.width+10)return;
  ctx.save();ctx.translate(x,pr.y);ctx.rotate(Math.atan2(pr.vy,pr.vx));
  ctx.fillStyle='#c8952a';ctx.fillRect(-13,-2,26,4);
  ctx.fillStyle='#ccc';ctx.fillRect(11,-3,6,6);
  ctx.restore();
}
function drawPlayer(cx){
  const p=player;
  const invis=PU.invis>0&&Math.floor(tick/4)%3!==0;
  if(invis)return;
  if(p.invincible>0&&Math.floor(p.invincible/4)%2===0)return;
  const px=Math.round(p.x-cx),py=Math.round(p.y);
  ctx.save();
  if(p.facing===-1){ctx.translate(px+p.w,py);ctx.scale(-1,1);}else ctx.translate(px,py);
  if(PU.shield>0){ctx.strokeStyle='rgba(0,255,170,.65)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.w/2,p.h/2,p.w,0,Math.PI*2);ctx.stroke();}
  if(biome.water){ctx.strokeStyle='rgba(100,200,255,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.w/2,p.h/2,p.w*.7,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='#e8d5a3';ctx.fillRect(2,10,18,18);ctx.fillRect(4,0,14,13);
  ctx.fillStyle='#f5a623';ctx.fillRect(3,0,16,5);ctx.fillRect(1,2,18,3);
  ctx.fillStyle='#111';ctx.fillRect(7,3,2,2);ctx.fillRect(13,3,2,2);
  ctx.fillStyle='#8b6318';ctx.fillRect(2,24,18,3);
  ctx.fillStyle='#6a5a8b';
  if(p.onGround&&Math.abs(p.vx)>.5){
    if(p.frame===0){ctx.fillRect(4,27,6,5);ctx.fillRect(12,27,6,7);}
    else{ctx.fillRect(4,27,6,7);ctx.fillRect(12,27,6,5);}
  }else{ctx.fillRect(p.onGround?4:2,27,6,6);ctx.fillRect(p.onGround?12:14,27,6,6);}
  if(hasSword){
    ctx.save();ctx.translate(p.w,p.h*.4);
    if(swordSwing>0)ctx.rotate(-.8);
    ctx.fillStyle='#c0d8ff';ctx.fillRect(0,-2,22,4);
    ctx.fillStyle='#888';ctx.fillRect(-5,-3,5,6);
    if(swordSwing>0){ctx.fillStyle='rgba(128,184,255,.5)';ctx.beginPath();ctx.arc(22,0,10,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
  ctx.restore();
  if(p.dead){ctx.fillStyle='rgba(255,50,0,.4)';ctx.fillRect(px-4,py-4,p.w+8,p.h+8);}
  if(window.godMode){ctx.fillStyle='rgba(255,200,0,.12)';ctx.fillRect(px-6,py-6,p.w+12,p.h+12);}
}
function drawWaterOverlay(){
  const W=cv.width,H=cv.height;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(0,40,120,.32)');g.addColorStop(1,'rgba(0,20,80,.12)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){const yy=(tick*1.2+i*70)%H;ctx.fillStyle='rgba(0,150,255,.04)';ctx.fillRect(0,yy,W,8);}
}

function draw(){
  camX=getCamX();
  drawBg();
  drawStars(camX);drawSnow(camX);drawLeaves(camX);drawBubbles(camX);
  drawPlatforms(camX);drawSpikes(camX);
  for(const c of coins)drawCoin(c,camX);
  drawSwordItem(camX);
  for(const pt of potions)drawAmphora(pt,camX);
  drawCaveEntrance(camX);
  drawDoor(camX);
  for(const e of enemies){
    if(e.type==='ptero')drawPtero(e,camX);
    if(e.type==='guard')drawGuard(e,camX);
    if(e.type==='shark')drawShark(e,camX);
  }
  for(const pr of projectiles)drawProjectile(pr,camX);
  drawPlayer(camX);
  if(biome.water)drawWaterOverlay();
}

// ══════════════════════════════════════════════
//  POWERUP HUD
// ══════════════════════════════════════════════
function updatePUHUD(){
  const cfg={speed:{label:'SPD',color:'#ffaa00'},doubleJump:{label:'2×↑',color:'#00aaff'},shield:{label:'SHD',color:'#00ffaa'},invis:{label:'INV',color:'#cc88ff'}};
  document.getElementById('puHud').innerHTML=Object.entries(PU).filter(([,v])=>v>0).map(([k])=>`<div class="pub" style="color:${cfg[k].color};border-color:${cfg[k].color}">${cfg[k].label}</div>`).join('');
}

// ══════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════
function loop(){
  if(GS==='playing'){tick++;updatePlayer();updateEnemies();draw();}
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════
//  INPUT
// ══════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' '){keys.jump=true;jumpPressed=true;}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.jump=false;
});
function setupBtn(id,keyName,isJump){
  const el=document.getElementById(id);
  const press=()=>{if(isJump){keys.jump=true;jumpPressed=true;}else keys[keyName]=true;el.classList.add('pressed');};
  const release=()=>{if(isJump)keys.jump=false;else keys[keyName]=false;el.classList.remove('pressed');};
  el.addEventListener('touchstart',e=>{e.preventDefault();press();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
  el.addEventListener('mousedown',press);el.addEventListener('mouseup',release);el.addEventListener('mouseleave',release);
}
setupBtn('bL','left',false);setupBtn('bR','right',false);setupBtn('bJ','jump',true);

// ══════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════
function startGame(){
  ac();
  lives=3;maxLives=3;score=0;levelNum=1;window.godMode=false;
  PU={speed:0,doubleJump:0,shield:0,invis:0};hasSword=false;inCaveLevel=false;
  genLevel();updateHUD();updatePUHUD();
  document.getElementById('menuOverlay').classList.remove('active');
  document.getElementById('menuOverlay').style.display='none';
  document.getElementById('go').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('controls').style.display='flex';
  GS='playing';startMusic();
}

function showMenu(){
  GS='menu';stopMusic();
  document.getElementById('go').style.display='none';
  document.getElementById('menuOverlay').style.display='flex';
  document.getElementById('menuOverlay').classList.add('active');
  document.getElementById('hud').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('bubble').style.display='none';
  document.getElementById('puHud').innerHTML='';
  document.getElementById('caveHint').style.opacity='0';
  drawMenuArt();
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',startGame);
document.getElementById('menuBtn').addEventListener('click',showMenu);

applyLang();
loop();
</script>
