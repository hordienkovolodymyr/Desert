<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SAND THIEF</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'Press Start 2P',monospace;}
#gc{position:relative;width:100vw;height:100vh;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;top:0;left:0;}
#menuCanvas{z-index:1;}
#cv{z-index:0;}

#menuOverlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
#menuOverlay.active{pointer-events:all;}
.mt{color:#f5d87a;font-size:clamp(20px,5vw,36px);text-align:center;line-height:1.9;text-shadow:3px 3px 0 #000,0 0 30px #f5a62388;margin-bottom:10px;letter-spacing:3px;}
.ms{color:#e8d5a3cc;font-size:clamp(6px,1.4vw,9px);margin-bottom:36px;letter-spacing:4px;}
.mb{background:rgba(10,8,4,.82);border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.2vw,13px);padding:12px 26px;cursor:pointer;margin:6px;letter-spacing:1px;backdrop-filter:blur(2px);}
.mb:hover,.mb:focus{background:#f5a623;color:#0a0a0a;outline:none;}
.pd{color:#f5d87a;font-size:20px;margin:6px 0 18px;opacity:.6;letter-spacing:8px;}

#settingsPanel{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.sp-title{color:#f5a623;font-size:clamp(12px,3vw,20px);margin-bottom:10px;text-shadow:3px 3px 0 #000;}
.sp-row{display:flex;align-items:center;gap:16px;color:#e8d5a3;font-size:clamp(7px,1.6vw,10px);}
.sp-label{width:180px;text-align:right;}
.sp-btn{background:transparent;border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:9px;padding:6px 10px;cursor:pointer;}
.sp-btn:hover{background:#f5a623;color:#000;}
.sp-ver{color:#555;font-size:7px;margin-top:20px;}
.sp-slider{-webkit-appearance:none;appearance:none;width:120px;height:6px;border-radius:3px;background:#333;outline:none;cursor:pointer;}
.sp-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#f5a623;cursor:pointer;border:2px solid #000;}
.diff-btn{background:rgba(10,8,4,.7);border:2px solid #555;color:#aaa;font-family:'Press Start 2P',monospace;font-size:clamp(7px,1.6vw,10px);padding:8px 12px;cursor:pointer;letter-spacing:1px;transition:all .15s;}
.diff-btn.active{border-color:#f5a623;color:#f5a623;background:rgba(245,166,35,.12);}
.diff-btn:hover{border-color:#f5a623;color:#f5d87a;}

/* minimap */
#minimap{position:fixed;top:32px;left:15px;width:160px;height:20px;background:rgba(0,0,0,.6);border:1px solid rgba(245,166,35,.4);border-radius:3px;z-index:6;pointer-events:none;display:none;}
/* mobile controls — bigger */
#controls{position:fixed;bottom:0;left:0;right:0;height:168px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 16px;pointer-events:none;z-index:5;}
.dpad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px;gap:5px;pointer-events:all;}
.bc{background:rgba(245,166,35,.18);border:2px solid rgba(245,166,35,.55);color:#f5a623;font-family:'Press Start 2P',monospace;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.bc:active,.bc.pressed{background:rgba(245,166,35,.55);border-color:#f5d87a;box-shadow:0 0 8px rgba(245,166,35,.5);}
.bl{grid-column:1;grid-row:2;}.br{grid-column:3;grid-row:2;}
.be{grid-column:2;grid-row:1;opacity:0;pointer-events:none;}.be2{grid-column:2;grid-row:2;opacity:0;pointer-events:none;}
.bj{width:88px;height:88px;border-radius:50%;background:rgba(245,166,35,.18);border:3px solid rgba(245,166,35,.65);color:#f5a623;font-family:'Press Start 2P',monospace;font-size:11px;display:flex;align-items:center;justify-content:center;pointer-events:all;user-select:none;-webkit-user-select:none;flex-direction:column;gap:3px;}
.bj:active,.bj.pressed{background:rgba(245,166,35,.55);border-color:#f5d87a;box-shadow:0 0 10px rgba(245,166,35,.5);}

#caveBtn{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);
  background:rgba(10,5,20,.85);border:2px solid #f5a623;color:#f5a623;
  font-family:'Press Start 2P',monospace;font-size:9px;padding:8px 16px;
  cursor:pointer;pointer-events:all;z-index:6;display:none;
  animation:cavePulse .7s infinite alternate;}
@keyframes cavePulse{from{border-color:#f5a623;color:#f5a623;}to{border-color:#fff;color:#fff;}}

#hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 48px 0 15px;z-index:5;pointer-events:none;}
.hi{color:#f5a623;font-size:clamp(7px,1.6vw,10px);text-shadow:2px 2px 0 #000;white-space:nowrap;}
#heartsHud{display:flex;gap:4px;align-items:center;}
#puHud{position:fixed;top:42px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;pointer-events:none;}
.pub{font-size:6px;padding:3px 5px;border-radius:2px;border:1px solid;white-space:nowrap;}
#biomeTag{position:fixed;top:30px;left:50%;transform:translateX(-50%);color:#aaddff;font-size:7px;text-shadow:2px 2px 0 #000;z-index:5;pointer-events:none;opacity:.85;letter-spacing:1px;}

#go{position:absolute;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;}
.got{color:#e33;font-size:clamp(18px,5vw,30px);text-shadow:4px 4px 0 #800;margin-bottom:28px;animation:blink .5s infinite;}
#cd{position:fixed;top:50px;left:50%;transform:translateX(-50%);color:#ffe066;font-size:8px;z-index:20;text-shadow:0 0 10px #f5a623;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}
#dmg{position:fixed;inset:0;background:rgba(255,0,0,.35);pointer-events:none;z-index:8;opacity:0;transition:opacity .15s;}
#bubble{position:fixed;inset:0;background:rgba(0,80,180,.15);pointer-events:none;z-index:4;display:none;}
#nightOverlay{position:fixed;inset:0;background:rgba(0,0,30,.0);pointer-events:none;z-index:3;transition:background 2s;}

#exitGameBtn{position:fixed;top:8px;right:10px;width:28px;height:28px;background:rgba(10,8,4,.85);border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:25;pointer-events:all;}
#exitGameBtn:hover{background:#f5a623;color:#0a0a0a;}
#confirmOverlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;pointer-events:all;}
.confirm-box{background:#111;border:3px solid #f5a623;padding:24px;text-align:center;max-width:85vw;box-shadow:0 0 20px rgba(0,0,0,0.5);}
.confirm-txt{color:#e8d5a3;font-size:10px;line-height:1.8;margin-bottom:20px;text-transform:uppercase;}
.confirm-btns{display:flex;justify-content:center;gap:15px;}
.confirm-btn{background:rgba(0,0,0,0.5);border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:10px;padding:8px 16px;cursor:pointer;}
.confirm-btn:hover{background:#f5a623;color:#000;}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>

<body>
<div id="gc">
  <canvas id="menuCanvas"></canvas>
  <canvas id="cv"></canvas>

  <div id="menuOverlay" class="active">
    <div class="mt">DESERT<br>THIEF</div>
    <div class="pd">▪ ▪ ▪ ▪ ▪</div>
    <div class="ms">DESERT THIEF • 1987</div>
    <div id="diffPanel" style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px;">
      <div style="color:#f5d87a;font-size:clamp(6px,1.4vw,9px);letter-spacing:2px;margin-bottom:4px;" id="lblDiff">DIFFICULTY</div>
      <div style="display:flex;gap:10px;">
        <button class="diff-btn active" id="diffEasy" data-diff="easy">🌵 EASY</button>
        <button class="diff-btn" id="diffNormal" data-diff="normal">⚔ NORMAL</button>
        <button class="diff-btn" id="diffHard" data-diff="hard">💀 HARD</button>
      </div>
    </div>
    <button class="mb" id="startBtn">▶ <span id="lblPlay">PLAY</span></button>
    <button class="mb" id="settingsBtn" style="font-size:clamp(8px,2vw,11px);border-color:#aaa;color:#aaa">⚙ <span id="lblSettings">SETTINGS</span></button>
  </div>

  <!-- BOSS OVERLAY -->
  <div id="bossOverlay" style="display:none;position:fixed;inset:0;z-index:50;pointer-events:none;">
    <div id="bossHpBar" style="position:fixed;bottom:180px;left:50%;transform:translateX(-50%);width:320px;max-width:90vw;text-align:center;display:none;">
      <div style="color:#ff2200;font-family:'Press Start 2P',monospace;font-size:8px;text-shadow:2px 2px #000;margin-bottom:4px;" id="bossName">BOSS</div>
      <div style="background:#300;border:2px solid #ff2200;border-radius:3px;height:14px;width:100%;position:relative;">
        <div id="bossHpFill" style="background:linear-gradient(90deg,#ff2200,#ff6600);height:100%;width:100%;border-radius:2px;transition:width .2s;"></div>
      </div>
    </div>
  </div>

  <div id="settingsPanel">
    <div class="sp-title" id="lblSettingsTitle">SETTINGS</div>
    <div class="sp-row">
      <div class="sp-label" id="lblLang">Language / Мова</div>
      <button class="sp-btn" id="langBtn">🇬🇧 ENG</button>
    </div>
    <div class="sp-row">
      <div class="sp-label" id="lblSound">Sound</div>
      <button class="sp-btn" id="soundBtn">🔊 ON</button>
    </div>
    <div class="sp-row">
      <div class="sp-label" id="lblMusic">Music</div>
      <button class="sp-btn" id="musicBtn">🎵 ON</button>
    </div>
    <div class="sp-row">
      <div class="sp-label" id="lblMusicVol">Music Volume</div>
      <input type="range" class="sp-slider" id="musicVolSlider" min="0" max="100" value="10">
      <span id="musicVolVal" style="color:#f5a623;font-size:8px;min-width:28px;">10%</span>
    </div>
    <div class="sp-row">
      <div class="sp-label" id="lblMusicTrack">Music Track</div>
      <select id="musicTrackSelect" style="background:#111;border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 8px;cursor:pointer;max-width:190px;"></select>
      <button id="musicPreviewBtn" style="background:transparent;border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:9px;padding:5px 8px;cursor:pointer;margin-left:6px;">▶</button>
    </div>
    <button class="mb" id="settingsBackBtn" style="margin-top:20px">← <span id="lblBack">BACK</span></button>
    <div class="sp-ver">DESERT THIEF v0.5.0 • 2026</div>
  </div>

  <div id="go">
    <div class="got" id="lblDead">YOU DIED</div>
    <!-- Результат поточної гри -->
    <div id="goScore" style="font-family:'Press Start 2P',monospace;color:#f5a623;font-size:12px;margin:8px 0 4px;text-align:center;"></div>
    <div id="goLevel" style="font-family:'Press Start 2P',monospace;color:#aaa;font-size:8px;margin-bottom:10px;text-align:center;"></div>
    <!-- Введення імені якщо новий рекорд -->
    <div id="newRecordBox" style="display:none;text-align:center;margin-bottom:10px;">
      <div style="font-family:'Press Start 2P',monospace;color:#f5d87a;font-size:9px;margin-bottom:6px;">★ NEW RECORD! ★</div>
      <div style="font-family:'Press Start 2P',monospace;color:#aaa;font-size:7px;margin-bottom:6px;">ENTER YOUR NAME (3 CHARS)</div>
      <input id="playerNameInput" maxlength="3" style="background:#111;border:2px solid #f5a623;color:#f5a623;font-family:'Press Start 2P',monospace;font-size:14px;width:60px;text-align:center;padding:6px;text-transform:uppercase;" value="AAA">
      <button class="mb" id="saveNameBtn" style="display:block;margin:8px auto 0;font-size:9px;">✓ SAVE</button>
    </div>
    <!-- Таблиця рекордів -->
    <div id="hiscoreTable" style="margin:4px 0 10px;min-width:200px;"></div>
    <button class="mb" id="retryBtn">↺ <span id="lblRetry">RETRY</span></button>
    <button class="mb" id="menuBtn" style="margin-top:8px;font-size:10px;border-color:#888;color:#888">⌂ <span id="lblMenu">MENU</span></button>
  </div>

  <div id="hud" style="display:none">
    <div id="heartsHud"></div>
    <div id="armorHud" style="display:flex;gap:2px;align-items:center;min-height:18px;"></div>
    <div class="hi" id="ld">LEVEL 1</div>
    <div class="hi" id="sc">000000</div>
  </div>
  <div id="puHud"></div>
  <div id="biomeTag"></div>
  <canvas id="minimap"></canvas>
  <button id="caveBtn">▲ <span id="lblCaveBtn">ENTER CAVE</span></button>
  <button id="exitGameBtn">X</button>
  <div id="cd"></div>
  <div id="dmg"></div>
  <div id="bubble"></div>
  <div id="nightOverlay"></div>

  <div id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-txt">you are really want to leave this game?</div>
      <div class="confirm-btns">
        <button class="confirm-btn" id="confirmYes">YES</button>
        <button class="confirm-btn" id="confirmNo">NO</button>
      </div>
    </div>
  </div>

  <div id="controls" style="display:none">
    <div class="dpad">
      <div class="be"></div><div class="be2"></div>
      <div class="bc bl" id="bL">◀</div>
      <div class="bc br" id="bR">▶</div>
    </div>
    <div style="position:relative;width:120px;height:160px;pointer-events:none;">
      <!-- Attack button: top-right, higher up -->
      <div class="bj" id="bA" style="position:absolute;top:0;right:0;width:64px;height:64px;font-size:20px;border-color:#ff8844;color:#ff8844;pointer-events:all;">⚔</div>
      <!-- Jump button: bottom-left of this container -->
      <div class="bj" id="bJ" style="position:absolute;bottom:0;left:0;pointer-events:all;"><span>▲</span><span style="font-size:7px" id="lblJump">JUMP</span></div>
    </div>
  </div>
</div>

let lang='en'; 
function T(k){return LANGS[lang][k]||k;}

const LANG_FLAGS = { en: '🇬🇧 ENG', uk: '🇺🇦 УКР', pl: '🇵🇱 POL', it: '🇮🇹 ITA' };
const LANG_KEYS = Object.keys(LANGS);

function applyLang(){
  document.getElementById('lblPlay').textContent=T('play');
  document.getElementById('lblSettings').textContent=T('settings');
  document.getElementById('lblSettingsTitle').textContent=T('settingsTitle');
  document.getElementById('lblLang').textContent=T('lang');
  document.getElementById('lblSound').textContent=T('sound');
  document.getElementById('lblMusic').textContent=T('music');
  document.getElementById('lblMusicVol').textContent=T('musicVol');
  document.getElementById('lblBack').textContent=T('back');
  document.getElementById('lblDead').textContent=T('dead');
  document.getElementById('lblRetry').textContent=T('retry');
  document.getElementById('lblMenu').textContent=T('menu');
  document.getElementById('lblJump').textContent=T('jump');
  document.getElementById('lblCaveBtn').textContent=inCaveLevel?T('exitCaveBtn'):T('caveBtn');
  document.getElementById('langBtn').textContent=LANG_FLAGS[lang];
  document.getElementById('soundBtn').textContent=(soundOn?'🔊 ':'🔇 ')+T(soundOn?'on':'off');
  document.getElementById('musicBtn').textContent='🎵 '+T(musicOn?'on':'off');
  
  const menuTitle = document.querySelector('.mt');
  if (menuTitle) menuTitle.innerHTML = lang === 'uk' ? 'ПІЩАНИЙ<br>ЗЛОДІЙ' : (lang === 'pl' ? 'ZŁODZIEJ<br>PUSTYNII' : (lang === 'it' ? 'LADRO DEL<br>DESERTO' : 'DESERT<br>THIEF'));
  
  if(GS==='playing')updateHUD();
  updateBiomeTag();
}

let soundOn=true,musicOn=true;
document.getElementById('langBtn').addEventListener('click',()=>{

});
document.getElementById('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;applyLang();});

let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f,t,dur,v=.22,fe=null,d=0){
  if(!soundOn)return;
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type=t;o.frequency.setValueAtTime(f,a.currentTime+d);
    if(fe)o.frequency.exponentialRampToValueAtTime(fe,a.currentTime+d+dur);
    g.gain.setValueAtTime(v,a.currentTime+d);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+dur);
    o.start(a.currentTime+d);o.stop(a.currentTime+d+dur);
  }catch(e){}
}

const CALM_TRACKS=['desert_wind','winter_hush','deep_waters','green_path','crystal_lullaby','starfall','ancient_temple','midnight_river','morning_mist'];
const FUN_TRACKS=['tavern_dance','clockwork','goblin_market','pirate_jig','fairy_hop','dragon_chase','market_bustle','hero_march','carnival','pixie_chase'];
const CAVE_TRACK='cave_pulse';

let selectedTrackId=null;
let _currentLevelTrack=null; // обраний трек для поточного рівня

function pickRandomLevelTrack(){
  if(biome&&biome.id==='cave'){_currentLevelTrack=CAVE_TRACK;return;}
  // Чергуємо: непарні рівні — спокійні, парні — веселі
  const pool=levelNum%2===0?FUN_TRACKS:CALM_TRACKS;
  const idx=Math.floor(Math.random()*pool.length);
  _currentLevelTrack=pool[idx];
}

function getActiveTrack(){
  if(selectedTrackId){const t=MUSIC_TRACKS.find(t=>t.id===selectedTrackId);if(t)return t;}
  const id=_currentLevelTrack||(biome&&biome.id==='cave'?CAVE_TRACK:CALM_TRACKS[0]);
  return MUSIC_TRACKS.find(t=>t.id===id)||MUSIC_TRACKS[0];
}

(function buildTrackSelect(){

let _previewTimeout=null;
function previewTrack(trackId){
  stopMusic();clearTimeout(_previewTimeout);
  _curMusic=trackId?MUSIC_TRACKS.find(t=>t.id===trackId)||MUSIC_TRACKS[0]:getActiveTrack();
  _melIdx=0;_melTime=0;_bassIdx=0;_bassTime=0;_chordIdx=0;_chordTime=0;_arpIdx=0;_arpTime=0;
  if(!bgInt)bgInt=setInterval(bgTick,90);
  if(GS!=='playing')_previewTimeout=setTimeout(()=>{if(GS!=='playing')stopMusic();},10000);
}

let bgInt=null;
let _melIdx=0,_melTime=0,_bassIdx=0,_bassTime=0,_chordIdx=0,_chordTime=0,_arpIdx=0,_arpTime=0;
let _curMusic=null;
let musicVolume=0.10;

function playChipNote(freq,dur,vol,wave,delay=0){
  if(!musicOn||!freq)return;
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type=wave;o.frequency.setValueAtTime(freq,a.currentTime+delay);
    const v=vol*musicVolume;
    g.gain.setValueAtTime(0,a.currentTime+delay);
    g.gain.linearRampToValueAtTime(v,a.currentTime+delay+0.01);
    g.gain.setValueAtTime(v,a.currentTime+delay+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+delay+dur);
    o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur+0.02);
  }catch(e){}
}

function bgTick(){
  if(!musicOn||!_curMusic)return;
  const m=_curMusic,s=0.09;
  _melTime-=s;if(_melTime<=0){const n=m.melody[_melIdx%m.melody.length];playChipNote(n[0],n[1],m.melVol,m.melWave);_melTime=n[1];_melIdx++;}
  _bassTime-=s;if(_bassTime<=0){const n=m.bass[_bassIdx%m.bass.length];playChipNote(n[0],n[1],m.bassVol,m.bassWave);_bassTime=n[1];_bassIdx++;}
  _chordTime-=s;if(_chordTime<=0){const n=m.chord[_chordIdx%m.chord.length];playChipNote(n[0],n[1],m.chordVol,m.chordWave);_chordTime=n[1];_chordIdx++;}
  _arpTime-=s;if(_arpTime<=0){const n=m.arp[_arpIdx%m.arp.length];playChipNote(n[0],n[1],m.arpVol,m.arpWave);_arpTime=n[1];_arpIdx++;}
}

function startMusic(){
  stopMusic();
  if(AC&&AC.state==='suspended')AC.resume();
  _curMusic=getActiveTrack();
  _melIdx=0;_melTime=0;_bassIdx=0;_bassTime=0;_chordIdx=0;_chordTime=0;_arpIdx=0;_arpTime=0;
  if(!bgInt)bgInt=setInterval(bgTick,90);
}
function stopMusic(){
  clearInterval(bgInt);bgInt=null;
  _melIdx=0;_melTime=0;_bassIdx=0;_bassTime=0;_chordIdx=0;_chordTime=0;_arpIdx=0;_arpTime=0;
}

  const W=menuCv.width,H=menuCv.height;
  mctx.clearRect(0,0,W,H);
  // Draw photo background — cover fit
  if(_menuBgImg.complete&&_menuBgImg.naturalWidth){

  for(let j=0;j<H;j+=3){mctx.fillStyle='rgba(0,0,0,.06)';mctx.fillRect(0,j,W,1);}

function spawnParticles(x,y,count,colorsArr,opts={}){
  for(let i=0;i<count;i++){
    const ang=rnd(0,Math.PI*2);
    const spd=rnd(opts.minSpd||1,opts.maxSpd||4);
    particles.push({
      x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-(opts.upBias||0),
      life:rnd(opts.minLife||18,opts.maxLife||36),
      maxLife:opts.maxLife||36,
      r:rnd(opts.minR||2,opts.maxR||5),
      col:colorsArr[rndInt(0,colorsArr.length-1)],
      gravity:opts.gravity!==undefined?opts.gravity:.18,
      shrink:opts.shrink!==undefined?opts.shrink:true,
    });
  }
}
function spawnCoinParticles(x,y){spawnParticles(x,y,8,['#ffe066','#ffd700','#fff8a0','#f5a623'],{upBias:2,minSpd:1.5,maxSpd:4,minLife:14,maxLife:28,minR:2,maxR:4});}
function spawnEnemyParticles(x,y,col){spawnParticles(x,y,14,[col,'#ff4400','#ffaa00','#fff'],{upBias:1.5,minSpd:1,maxSpd:5,minLife:20,maxLife:40,minR:2,maxR:6,gravity:.22});}
function spawnJumpDust(x,y){spawnParticles(x,y,5,['rgba(200,180,140,.7)','rgba(180,160,120,.5)','rgba(220,200,160,.6)'],{upBias:0,minSpd:.5,maxSpd:2,minLife:10,maxLife:20,minR:2,maxR:5,gravity:.05});}
function spawnHitParticles(x,y){spawnParticles(x,y,10,['#ff2200','#ff6600','#ffaa00'],{upBias:2,minSpd:1.5,maxSpd:4.5,minLife:16,maxLife:30,gravity:.2});}
function spawnWaterBubbles(x,y){spawnParticles(x,y,6,['rgba(100,200,255,.8)','rgba(150,220,255,.6)','#fff'],{upBias:3,minSpd:.5,maxSpd:2.5,minLife:20,maxLife:40,minR:2,maxR:5,gravity:-.08});}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.type==='text'){p.y+=p.vy;p.life--;}
    else{p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=.94;p.life--;}
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(cx){
  for(const p of particles){
    const px=p.x-cx;if(px<-60||px>cv.width+60)continue;
    if(p.type==='text'){
      const alpha=p.life/55;
      ctx.globalAlpha=Math.min(1,alpha*2);
      ctx.fillStyle=p.color||'#f5d87a';
      ctx.font=`bold ${p.size||8}px "Press Start 2P",monospace`;
      ctx.textAlign='center';
      ctx.fillText(p.text,px,p.y);
      ctx.textAlign='left';
    } else {
      const alpha=p.life/p.maxLife;
      const r=p.shrink?p.r*alpha:p.r;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(px,p.y,Math.max(.5,r),0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

function genLevel(forceBiomeId, spawnAtCaveEntrance=false){

  if(!levelNum||levelNum<1||levelNum>9999)levelNum=1;

  }
  
  document.getElementById('bubble').style.display=biome.water?'block':'none';
  inCaveLevel=biome.id==='cave';
  allCoinsCollected=false;
  isNight=biome.water||biome.id==='cave'?true:Math.random()>.5;
  nightTimer=0;
  document.getElementById('nightOverlay').style.background=isNight?'rgba(0,0,30,.45)':'rgba(0,0,30,0)';
  updateBiomeTag();
  applyLang();
  pickRandomLevelTrack();
  if(GS==='playing')startMusic();
  // Скидаємо лут що не підібрали (новий рівень — новий старт)
  bossLoot=null;
  // Завжди оновлюємо HUD броні щоб щити лишались видимими
  setTimeout(()=>updateArmorHUD(),50);

  platforms=[];spikes=[];coins=[];potions=[];enemies=[];projectiles=[];particles=[];

  snowflakes=biome.snow?Array.from({length:70},()=>({x:rnd(0,LEVEL_W),y:rnd(0,PH),spd:rnd(.5,2),r:rnd(2,5)})):[];
  bubbles=biome.water?Array.from({length:30},()=>({x:rnd(0,LEVEL_W),y:rnd(PH*.2,PH),spd:rnd(.3,1),r:rnd(3,9),phase:rnd(0,6.28)})):[];
  leaves=biome.id==='forest'?Array.from({length:55},()=>({x:rnd(0,LEVEL_W),y:rnd(0,PH),spd:rnd(.4,1.2),r:rnd(3,7),phase:rnd(0,6.28),col:['#2a7a2a','#4a9a2a','#3a8a1a','#6aaa3a'][rndInt(0,3)]})):[];

  platforms.push({x:0,y:PH-TILE,w:LEVEL_W,h:TILE,ground:true});
  let cx_=200;
  while(cx_<LEVEL_W-300){
    const pw=rnd(90,210),py=PH-TILE*rnd(2.5,7.5);
    platforms.push({x:cx_,y:py,w:pw,h:TILE*.5,ground:false});
    cx_+=pw+rnd(70,200);

  if(!biome.water&&biome.id!=='forest')for(let i=0;i<9;i++)spikes.push({x:rnd(300,LEVEL_W-400),y:PH-TILE-20,w:24,h:20});

  for(let i=0;i<10;i++){const pl=platforms[rndInt(1,platforms.length-1)];coins.push({x:pl.x+rnd(12,pl.w-12),y:pl.y-22,r:9,collected:false});}
  for(let i=0;i<4;i++)coins.push({x:rnd(200,LEVEL_W-200),y:PH-TILE-22,r:9,collected:false});

  const potDefs=[
    {type:'speed',color:'#ffaa00',label:'SPD'},
    {type:'doubleJump',color:'#00aaff',label:'2×↑'},
    {type:'shield',color:'#00ffaa',label:'SHD'},
    {type:'invis',color:'#cc88ff',label:'INV'},
    {type:'heal',color:'#ff3333',label:'❤'},
  ];
  potDefs.forEach((pt,i)=>{
    const pl=platforms[rndInt(1,Math.min(i*3+3,platforms.length-1))];
    potions.push({x:pl.x+pl.w*.45,y:pl.y-30,...pt,collected:false});

  }

  // FIXED: If spawnAtCaveEntrance is true, we position the hero right at the surface cave entrance coordinates
  let sX = 60;
  let sY = PH-TILE-52;
  if(inCaveLevel) {
    sX = caveEntrance.x + 12; 
  } else if(spawnAtCaveEntrance) {
    sX = LEVEL_W*.42 + 12; // Teleports directly to the surface cave door
  }
  
  player={x:sX,y:sY,w:22,h:42,vx:0,vy:0,onGround:false,facing:1,frame:0,frameTimer:0,dead:false,deathTimer:0,invincible:0,jumpsLeft:1};
  camX=getCamX();
}

// ══════════════ CAVE STATE SAVE/RESTORE ══════
function saveSurfaceState(){
  _savedSurfaceState={
    biomeId:biome.id,levelNum,
    platforms:[...platforms],spikes:[...spikes],
    coins:coins.map(c=>({...c})),
    potions:potions.map(p=>({...p})),
    enemies:enemies.map(e=>({...e})),
    swordItem:swordItem?{...swordItem}:null,
    caveEntrance:caveEntrance?{...caveEntrance}:null,
    doorObj:{...doorObj},
    allCoinsCollected,isNight,
    campfires:(window._campfires||[]).map(c=>({...c})),
    playerX:player.x,playerY:player.y,
  };
}
function restoreSurfaceState(){
  if(!_savedSurfaceState)return false;
  const s=_savedSurfaceState;
  biome=BIOMES.find(b=>b.id===s.biomeId)||BIOMES[0];
  levelNum=s.levelNum||1;
  platforms=s.platforms;spikes=s.spikes;
  coins=s.coins;potions=s.potions;
  enemies=s.enemies;
  swordItem=s.swordItem;caveEntrance=s.caveEntrance;
  doorObj=s.doorObj;
  allCoinsCollected=s.allCoinsCollected;
  isNight=s.isNight;
  window._campfires=s.campfires;
  particles=[];projectiles=[];
  const PH=cv.height-150;
  // Spawn near cave entrance
  const sx=caveEntrance?caveEntrance.x+caveEntrance.w+20:LEVEL_W*.42+80;
  player={x:sx,y:PH-TILE-52,w:22,h:42,vx:0,vy:0,onGround:false,facing:1,frame:0,frameTimer:0,dead:false,deathTimer:0,invincible:60,jumpsLeft:1};
  camX=getCamX();
  inCaveLevel=false;
  nearCave=false;
  document.getElementById('bubble').style.display='none';
  document.getElementById('nightOverlay').style.background=isNight?'rgba(0,0,30,.45)':'rgba(0,0,30,0)';
  updateBiomeTag();applyLang();pickRandomLevelTrack();startMusic();
  return true;
}
function getCamX(){return Math.max(0,Math.min(LEVEL_W-cv.width,player.x-cv.width*.35));}
function colRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// ══════════════ PLAYER UPDATE ════════════════
function updatePlayer(){
  const p=player,PH=cv.height-150;
  if(p.dead){p.deathTimer--;p.vy+=GRAV;p.y+=p.vy;if(p.deathTimer<=0)triggerDeath();return;}
  if(p.invincible>0)p.invincible--;
  const spd=PU.speed>0?SPD*1.75:SPD;
  if(keys.left){p.vx=-spd;p.facing=-1;}
  else if(keys.right){p.vx=spd;p.facing=1;}
  else p.vx*=.78;
  if(biome.water){p.vx*=.75;p.vy*=.82;}
  const maxJ=PU.doubleJump>0?2:1;
  if((keys.jump||jumpPressed)&&(p.onGround||biome.water)){
    if(biome.water){p.vy=-2.8;SFX.bubble();spawnWaterBubbles(p.x+p.w/2,p.y+p.h);}
    else if(p.jumpsLeft>0){p.vy=JF;p.jumpsLeft--;p.onGround=false;SFX.jump();spawnJumpDust(p.x+p.w/2,p.y+p.h);}
  }
  jumpPressed=false;
  p.vy+=biome.water?GRAV*.18:GRAV;
  if(biome.water){if(p.vy>2.2)p.vy=2.2;if(p.vy<-3)p.vy=-3;}
  p.x+=p.vx;p.y+=p.vy;
  p.x=Math.max(0,Math.min(LEVEL_W-p.w,p.x));
  if(biome.water&&p.y<20){p.y=20;p.vy=Math.max(0,p.vy);}
  p.onGround=false;
  for(const pl of platforms){
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h+Math.abs(p.vy)+2&&p.vy>=0){
      p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.jumpsLeft=maxJ;
    }
  }
  if(p.y>PH+100){if(biome.water){p.y=PH-10;p.vy=-1.5;}else{startDeath();return;}}
  if(!window.godMode&&p.invincible<=0){
    for(const s of spikes){if(p.x+p.w-5>s.x&&p.x+5<s.x+s.w&&p.y+p.h>s.y){blockOrTakeHit(60);return;}}
    for(const cf of (window._campfires||[])){if(p.x+p.w-5>cf.x&&p.x+5<cf.x+cf.w&&p.y+p.h>cf.y+4){blockOrTakeHit(60);return;}}
    for(const pr of projectiles){
      if(!pr.dead&&colRect(p,{x:pr.x-5,y:pr.y-5,w:10,h:10})){
        pr.dead=true;
        blockOrTakeHit(60);
      }
    }
  }
  
  let justCollected=false;
  for(const c of coins){
    if(!c.collected&&Math.hypot(p.x+p.w/2-c.x,p.y+p.h/2-c.y)<c.r+14){
      c.collected=true;
      const pts=c.treasure?300:10;
      score+=Math.round(pts*DIFF[difficulty].scoreBonus);
      updateHUD();
      scorePopup(c.x,c.y-10,c.treasure?'+300':'+10','#f5d87a');
      spawnCoinParticles(c.x,c.y);
      c.treasure?SFX.treasure():SFX.coin();justCollected=true;
    }
  }
  if(justCollected&&!allCoinsCollected&&coins.every(c=>c.collected)){
    allCoinsCollected=true;SFX.allCoins();showCD(T('allCoins'));
  }
  // Cave door always open; surface door requires all coins
  doorObj.open = inCaveLevel ? true : allCoinsCollected;

  if(swordItem&&!swordItem.collected&&colRect(p,swordItem)){swordItem.collected=true;hasSword=true;showCD(T('swordPickup'));SFX.win();}

  // Лут від боса — фізика і підбір
  if(bossLoot&&!bossLoot.collected){
    const PH=cv.height-150;
    bossLoot.vy+=0.35;bossLoot.y+=bossLoot.vy;
    // Відбиваємось від платформ і підлоги
    for(const pl of platforms){
      if(bossLoot.x+10>pl.x&&bossLoot.x+10<pl.x+pl.w&&bossLoot.y+20>pl.y&&bossLoot.y+20<pl.y+pl.h+8&&bossLoot.vy>0){
        bossLoot.y=pl.y-20;bossLoot.vy*=-0.3;
      }
    }
    if(bossLoot.y>PH-20){bossLoot.y=PH-20;bossLoot.vy=0;}
    // Підбір
    if(colRect(p,{x:bossLoot.x,y:bossLoot.y,w:20,h:20})){
      bossLoot.collected=true;
      if(bossLoot.type==='helmet'){
        armor.helmet=true;armorShields=Math.min(3,armorShields+1);
        showCD('🪖 HELMET! +1 SHIELD');
      } else if(bossLoot.type==='chest'){
        armor.chest=true;armorShields=Math.min(3,armorShields+2);
        showCD('🛡 ARMOR! +2 SHIELD');
      } else {
        // Ремонт — відновлюємо щити до максимуму
        const maxShields=(armor.helmet?1:0)+(armor.chest?2:0);
        armorShields=maxShields;
        showCD('🔧 ARMOR REPAIRED! FULL SHIELD');
      }
      SFX.win();updateArmorHUD();
    }
  }

  for(const pt of potions){
    if(!pt.collected&&colRect(p,{x:pt.x-10,y:pt.y-16,w:20,h:32})){
      pt.collected=true;
      if(pt.type==='heal'){
        lives++;maxLives=Math.max(maxLives,lives);updateHUD();showCD(T('heal'));SFX.heal();
      } else {PU[pt.type]={speed:600,doubleJump:1800,shield:1200,invis:1200}[pt.type]||600;updatePUHUD();SFX.potion();showCD({speed:T('speed'),doubleJump:T('dj'),shield:T('shield'),invis:T('invis')}[pt.type]);}
    }
  }

  nearCave=false;
  if(caveEntrance){
    const dist=Math.abs(p.x+p.w/2-(caveEntrance.x+caveEntrance.w/2));
    if(dist<65&&p.y+p.h>caveEntrance.y-10){nearCave=true;}
  }
  const caveBtn=document.getElementById('caveBtn');
  caveBtn.style.display=nearCave?'block':'none';

  if(doorObj.open&&colRect(p,doorObj)&&!levelTransitioning){
    levelTransitioning=true;
    if(inCaveLevel){
      SFX.cave();showCD(T('exitCave'));
      document.getElementById('caveBtn').style.display='none';
      setTimeout(()=>{
        if(!restoreSurfaceState()){
          inCaveLevel=false;preCaveBiome=null;genLevel('desert',true);
        }
        levelTransitioning=false;
      },600);
    } else {
      score+=Math.round(500*DIFF[difficulty].scoreBonus);updateHUD();SFX.levelup();showCD(T('levelDone'));
      setTimeout(()=>{
        levelNum++;preCaveBiome=null;updateHUD();
        // Бонус за рівень без втрат
        const noDmgBonus=lives>=livesAtLevelStart;
        const armorBonus=armorShields>0;
        let bonusPts=Math.round(500*DIFF[difficulty].scoreBonus);
        let bonusMsg='LEVEL CLEAR! +'+bonusPts;
        if(noDmgBonus){bonusPts+=200;bonusMsg='PERFECT! NO DAMAGE! +'+(Math.round(500*DIFF[difficulty].scoreBonus)+200);}
        else if(armorBonus){bonusPts+=100;bonusMsg='LEVEL CLEAR + ARMOR BONUS! +'+bonusPts;}
        score+=bonusPts;updateHUD();SFX.levelup();showCD(bonusMsg);
        livesAtLevelStart=lives;
        genLevel();
        if(levelNum>=4&&(levelNum-1)%3===0)setTimeout(()=>spawnBoss(),900);
        levelTransitioning=false;
      },1400);
    }
  }
  if(hasSword&&swordSwing>0&&!swordHitThisSwing){
    const reach=player.w+28;
    const sx=p.facing===1?p.x+p.w:p.x-reach;
    const hitBox={x:sx,y:p.y-4,w:reach,h:p.h+8};
    for(const e of enemies){
      if(e.dead)continue;
      if(colRect(hitBox,{x:e.x,y:e.y,w:e.w,h:e.h})){
        swordHitThisSwing=true;
        e.hp--;SFX.sword();
        spawnHitParticles(e.x+e.w/2,e.y+e.h/2);
        if(e.hp<=0){
          e.dead=true;e.deadTimer=30;SFX.kill();
          spawnEnemyParticles(e.x+e.w/2,e.y+e.h/2,biome.id==='cave'?'#8855ff':biome.id==='water'?'#00aaff':'#ff6600');
          // Очки залежно від типу ворога
          const baseKill=e.type==='guard'?(e.guardCol?.col==='red'?150:e.guardCol?.col==='blue'?100:50):
                         e.type==='boss'?500:e.type==='yeti'||e.type==='shark'?120:40;
          addKillCombo(e.x+e.w/2,e.y,baseKill);
        }
      }
    }
  }
  if(swordSwing>0){swordSwing--;}else{
    swordHitThisSwing=false;swordHitBossThisSwing=false;
    // Auto-attack while button held
    if(hasSword&&keys.attack){swordSwing=18;SFX.sword();}
  }
  Object.keys(PU).forEach(k=>{if(PU[k]>0){PU[k]--;if(PU[k]===0)updatePUHUD();}});
  p.frameTimer++;if(p.frameTimer>8){p.frame=(p.frame+1)%2;p.frameTimer=0;}

  if(!biome.water&&biome.id!=='cave'){
    nightTimer++;
    if(nightTimer>1800){nightTimer=0;isNight=!isNight;document.getElementById('nightOverlay').style.background=isNight?'rgba(0,0,30,.45)':'rgba(0,0,30,0)';updateBiomeTag();showCD(isNight?'🌙 '+T('night'):'☀ '+T('day'));}
  }
}

function updateArmorHUD(){
  // Оновлюємо іконки щитів броні в HUD
  let html='';
  for(let i=0;i<armorShields;i++) html+='<span style="color:#f5d87a;font-size:14px;text-shadow:0 0 6px #f5a623;">🛡</span>';
  const el=document.getElementById('armorHud');
  if(el)el.innerHTML=html;
}

function blockOrTakeHit(invTime=60,tgt=null){
  if(window.godMode)return;
  const target=tgt||player;
  if(armorShields>0){
    // Броня поглинає удар
    armorShields--;
    // Якщо щити скінчились — знімаємо предмети
    if(armorShields===0){armor.helmet=false;armor.chest=false;}
    else if(armorShields<2&&armor.chest&&armor.helmet){armor.chest=false;}// chest дає 2, helmet 1
    else if(armorShields===0)armor.helmet=false;
    flashDmg();SFX.hit();
    target.invincible=invTime;
    // Звук "клац" броні
    try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='square';o.frequency.setValueAtTime(180,a.currentTime);o.frequency.linearRampToValueAtTime(80,a.currentTime+.12);g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.15);o.start();o.stop(a.currentTime+.16);}catch(e){}
    updateArmorHUD();
    spawnHitParticles(target.x+target.w/2,target.y+target.h/2);
    showCD(armorShields>0?`🛡 BLOCKED! (${armorShields} left)`:'🛡 ARMOR BROKEN!');
  } else if(PU.shield>0){
    PU.shield=0;updatePUHUD();flashDmg();SFX.hit();target.invincible=invTime;
  } else {
    takeHit();
  }
}

function takeHit(){
  if(window.godMode)return;
  spawnHitParticles(player.x+player.w/2,player.y+player.h/2);
  lives--;updateHUD();flashDmg();SFX.hit();
  if(lives<=0){startDeath();}
  else player.invincible=90;
}

function updateEnemies(){
  const PH=cv.height-150;
  for(const e of enemies){
    if(e.dead){e.deadTimer--;continue;}
    if(e.type==='ptero'){
      e.phase+=.034;e.x+=e.vx;e.y=e.baseY+Math.sin(e.phase)*32;
      if(e.x<-50||e.x>LEVEL_W+50)e.x=e.vx>0?-50:LEVEL_W+50;
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis<=0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        blockOrTakeHit(60);
      }
    }
    if(e.type==='guard'){
      e.x+=e.vx*e.walkDir;e.walkTimer++;if(e.walkTimer>70){e.walkDir*=-1;e.walkTimer=0;}
      e.facing=player.x>e.x?1:-1;e.shootTimer--;
      if(e.shootTimer<=0){
        e.shootTimer=140+Math.random()*80;
        const dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy)||1;
        if(dist<440&&PU.invis<=0)projectiles.push({x:e.x+e.w/2,y:e.y+e.h*.4,vx:dx/dist*4,vy:dy/dist*2.5,dead:false});SFX.spear();
      }
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis<=0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        blockOrTakeHit(60);
      }
    }
    if(e.type==='yeti'){
      e.phase=(e.phase||0)+.04;e.x+=e.vx*e.walkDir;e.walkTimer++;
      if(e.walkTimer>90){e.walkDir*=-1;e.walkTimer=0;}
      for(const pl of platforms){if(e.x+e.w>pl.x&&e.x<pl.x+pl.w&&Math.abs((e.y+e.h)-pl.y)<12)e.y=pl.y-e.h;}
      e.facing=player.x>e.x?1:-1;e.attackTimer--;
      if(e.attackTimer<=0){
        e.attackTimer=120+Math.random()*80;const dx=player.x-(e.x+e.w/2);
        if(Math.abs(dx)<300&&PU.invis<=0){e.vx=dx>0?3.5:-3.5;setTimeout(()=>e.vx=1,400);SFX.yeti();}
      }
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis<=0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        blockOrTakeHit(80);
      }
    }
    if(e.type==='bat'){
      e.phase+=.06;e.x+=e.vx;e.y=e.baseY+Math.sin(e.phase)*24;
      if(e.x<-50||e.x>LEVEL_W+50)e.x=e.vx>0?-50:LEVEL_W+50;
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis<=0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        blockOrTakeHit(60);
      }
    }
    if(e.type==='spider'){
      e.x+=e.vx*e.walkDir;e.walkTimer++;if(e.walkTimer>60){e.walkDir*=-1;e.walkTimer=0;}
      e.facing=player.x>e.x?1:-1;e.shootTimer--;
      if(e.shootTimer<=0){
        e.shootTimer=160+Math.random()*80;
        const dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy)||1;
        if(dist<400&&PU.invis<=0)projectiles.push({x:e.x+e.w/2,y:e.y+e.h*.4,vx:dx/dist*3.2,vy:dy/dist*2,dead:false,web:true});
      }
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis<=0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        blockOrTakeHit(60);
      }
    }
    if(e.type==='shark'){
      e.phase+=.024;e.x+=e.vx;e.y=e.baseY+Math.sin(e.phase)*28;
      if(e.x<-60||e.x>LEVEL_W+60)e.x=e.vx>0?-60:LEVEL_W+60;
      if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis<=0&&colRect(player,{x:e.x,y:e.y,w:e.w,h:e.h})){
        blockOrTakeHit(80);
      }
    }
  }
  for(const pr of projectiles){if(pr.dead)continue;pr.x+=pr.vx;pr.y+=pr.vy;pr.vy+=.12;if(pr.x<0||pr.x>LEVEL_W||pr.y>cv.height-150)pr.dead=true;}
  for(const s of snowflakes){s.y+=s.spd;if(s.y>cv.height-150)s.y=-5;}
  for(const b of bubbles){b.y-=b.spd;b.x+=Math.sin(tick*.04+b.phase)*.5;if(b.y<0)b.y=cv.height-150;}
  for(const l of leaves){l.y+=l.spd*.5;l.x+=Math.sin(tick*.03+l.phase);if(l.y>cv.height-150)l.y=-8;}
}

function startDeath(){if(window.godMode)return;player.dead=true;player.deathTimer=50;player.vy=-9;player.vx=0;SFX.death();flashDmg();}
function triggerDeath(){
  if(lives>0){
    boss=null;isBossLevel=false;
    document.getElementById('bossHpBar').style.display='none';
    swordSwing=0;swordHitThisSwing=false;swordHitBossThisSwing=false;
    genLevel(inCaveLevel?'cave':getBiomeForLevel(levelNum));
    return;
  }
  GS='dead';stopMusic();
  document.getElementById('go').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('exitGameBtn').style.display='none';
  document.getElementById('puHud').innerHTML='';
  document.getElementById('caveBtn').style.display='none';
  showGameOver();
}
function flashDmg(){const e=document.getElementById('dmg');e.style.opacity=1;setTimeout(()=>e.style.opacity=0,160);}
function showCD(m){const e=document.getElementById('cd');e.textContent=m;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2600);}

// ══════════════ SCORE POPUP ══════════════════
function scorePopup(x,y,text,color='#f5d87a'){
  particles.push({type:'text',x,y,vy:-1.2,life:55,text,color,size:8});
}

// ══════════════ COMBO SYSTEM ══════════════════
function addKillCombo(ex,ey,basePoints){
  combo++;clearTimeout(_comboTimeout);
  const mul=combo>=5?3:combo>=3?2:1;
  const pts=Math.round(basePoints*mul*DIFF[difficulty].scoreBonus);
  score+=pts;updateHUD();
  const label=combo>=5?`x3 COMBO! +${pts}`:combo>=3?`x2 COMBO! +${pts}`:`+${pts}`;
  scorePopup(ex,ey,label,combo>=3?'#ff8844':'#f5d87a');
  _comboTimeout=setTimeout(()=>{combo=0;},1800);
}
let _comboTimeout=null;

// ══════════════ HISCORE ══════════════════════
const HS_KEY='desert_thief_hiscores';
function loadHiscores(){
  try{return JSON.parse(localStorage.getItem(HS_KEY))||[];}catch(e){return[];}
}
function saveHiscore(name,sc,lvl){
  const list=loadHiscores();
  list.push({name:name.toUpperCase().slice(0,3),score:sc,level:lvl,date:new Date().toLocaleDateString()});
  list.sort((a,b)=>b.score-a.score);
  list.splice(5); // топ-5
  localStorage.setItem(HS_KEY,JSON.stringify(list));
  return list;
}
function isNewRecord(sc){
  const list=loadHiscores();
  return list.length<5||sc>list[list.length-1].score||list.length===0;
}
function renderHiscoreTable(highlight=-1){
  const list=loadHiscores();
  if(!list.length){
    document.getElementById('hiscoreTable').innerHTML=
      '<div style="font-family:\'Press Start 2P\',monospace;color:#555;font-size:7px;text-align:center;">NO RECORDS YET</div>';
    return;
  }
  const medals=['🥇','🥈','🥉','4.','5.'];
  let html='<div style="font-family:\'Press Start 2P\',monospace;color:#f5a623;font-size:8px;text-align:center;margin-bottom:6px;">— HI-SCORE —</div>';
  list.forEach((e,i)=>{
    const isHl=i===highlight;
    const col=isHl?'#f5d87a':'#ccc';
    const bg=isHl?'rgba(245,166,35,.18)':'transparent';
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:${bg};border-radius:4px;${isHl?'border:1px solid #f5a623;':''}">

function drawBg(){
  const W=cv.width,H=cv.height;
  const bgDark=isNight?.6:1;
  function darken(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${Math.floor(r*bgDark)},${Math.floor(g*bgDark)},${Math.floor(b*bgDark)})`;}
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,darken(biome.bg[0]));gr.addColorStop(1,darken(biome.bg[1]));
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if((isNight||biome.stars)&&biome.id!=='cave'&&!biome.water){
    for(let i=0;i<60;i++){
      const sx=((i*137+800)%LEVEL_W)-camX;if(sx<-5||sx>W+5)continue;
      const sy=(i*97)%(H*.5);const b=(Math.sin(tick*.03+i)+1)*.5*(isNight?1:.4);
      ctx.fillStyle=`rgba(255,255,255,${b*.9})`;ctx.fillRect(sx,sy,1.5,1.5);
    }
    if(isNight){
      ctx.fillStyle='rgba(220,220,180,.85)';ctx.beginPath();ctx.arc(W*.82,H*.12,18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=darken(biome.bg[0]);ctx.beginPath();ctx.arc(W*.82+8,H*.12-4,14,0,Math.PI*2);ctx.fill();
    }
  }
  if(biome.water){
    // Seaweed on ground
    for(let i=0;i<18;i++){
      const wx=((i*280+60)-camX*.3)%(W+200)-60;
      const wh=40+Math.sin(i*1.4)*25;
      const sway=Math.sin(tick*.04+i*.8)*8;
      ctx.strokeStyle=`rgba(${20+i%3*10},${130+i%4*15},${60},0.7)`;
      ctx.lineWidth=4+i%3;ctx.beginPath();
      ctx.moveTo(wx,H-150);
      ctx.bezierCurveTo(wx+sway*.4,H-150-wh*.35,wx+sway*.7,H-150-wh*.65,wx+sway,H-150-wh);
      ctx.stroke();
      ctx.lineWidth=2;ctx.strokeStyle=`rgba(30,${160+i%3*20},80,0.5)`;
      ctx.beginPath();ctx.moveTo(wx+4,H-150);
      ctx.bezierCurveTo(wx+4+sway*.3,H-150-wh*.3,wx+4+sway*.6,H-150-wh*.6,wx+4+sway*.85,H-150-wh*.9);
      ctx.stroke();
    }
    // Jellyfish
    for(let i=0;i<6;i++){
      const jx=((i*720+200)-camX*.6)%(W+300)-80;
      const jy=H*(.18+i*.08)+Math.sin(tick*.04+i*1.2)*18;
      const pulse=(Math.sin(tick*.07+i)+1)*.5;
      const alpha=.45+pulse*.25;
      // Bell
      ctx.fillStyle=`rgba(180,100,255,${alpha})`;
      ctx.beginPath();ctx.ellipse(jx,jy,18,12+pulse*4,0,Math.PI,0);ctx.fill();
      ctx.fillStyle=`rgba(220,160,255,${alpha*.6})`;
      ctx.beginPath();ctx.ellipse(jx-4,jy-3,6,5,0,Math.PI,0);ctx.fill();
      // Tentacles
      ctx.lineWidth=1.2;
      for(let t=-2;t<=2;t++){
        ctx.strokeStyle=`rgba(200,120,255,${alpha*.5})`;
        const tx2=jx+t*6;const tlen=20+Math.sin(tick*.05+i+t)*8;
        ctx.beginPath();ctx.moveTo(tx2,jy);
        ctx.bezierCurveTo(tx2+Math.sin(tick*.04+t)*4,jy+tlen*.4,tx2+Math.sin(tick*.03+t+1)*4,jy+tlen*.7,tx2+Math.sin(tick*.05+t+2)*3,jy+tlen);
        ctx.stroke();
      }
      // Glow
      ctx.fillStyle=`rgba(200,100,255,${alpha*.12})`;ctx.beginPath();ctx.arc(jx,jy,26,0,Math.PI*2);ctx.fill();
    }
  }
  if(biome.id==='forest'){
    for(let i=0;i<14;i++){
      const tx=((i*380+100)-camX*.2)%(W+100)-50;
      ctx.fillStyle='#0a2a0a';ctx.fillRect(tx-5,H*.28,10,H*.58);
      ctx.fillStyle='#1a3a1a';ctx.beginPath();ctx.moveTo(tx,H*.08);ctx.lineTo(tx-22,H*.36);ctx.lineTo(tx+22,H*.36);ctx.fill();
      ctx.fillStyle='#0d2a0d';ctx.beginPath();ctx.moveTo(tx,H*.18);ctx.lineTo(tx-18,H*.44);ctx.lineTo(tx+18,H*.44);ctx.fill();
    }
  }
  if(biome.id==='cave'){
    // Stalactites from ceiling
    ctx.fillStyle='#1a0f2a';
    for(let i=0;i<22;i++){const sx=((i*240+50)-camX*.5)%(W+200)-50;const sh=28+Math.sin(i*1.7)*22;ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx-10,sh);ctx.lineTo(sx+10,sh);ctx.fill();
      // Drip
      const dripY=sh+((tick*1.2+i*37)%60);if(dripY<sh+55){ctx.fillStyle='rgba(100,80,140,.5)';ctx.beginPath();ctx.arc(sx,dripY,2,0,Math.PI*2);ctx.fill();}
    }
    // Wall torches — рівномірно розподілені по рівню
    const torchSpacing=Math.floor(LEVEL_W/7);
    for(let i=0;i<7;i++){
      const worldX=torchSpacing*i+torchSpacing*.5;
      const tx=worldX-camX*.85;
      if(tx<-80||tx>W+80)continue;
      const ty=H*.55;
      const flicker=(Math.sin(tick*.23+i*1.3)*.3+.7);
      // Torch bracket
      ctx.fillStyle='#5a3a1a';ctx.fillRect(tx-3,ty,6,20);ctx.fillRect(tx-7,ty-4,14,8);
      // Flame glow
      ctx.fillStyle=`rgba(255,140,0,${flicker*.25})`;ctx.beginPath();ctx.arc(tx,ty-8,22,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(255,200,0,${flicker*.18})`;ctx.beginPath();ctx.arc(tx,ty-8,14,0,Math.PI*2);ctx.fill();
      // Flame body animated
      ctx.fillStyle=`rgba(255,${Math.floor(80+flicker*80)},0,${flicker*.9})`;
      ctx.beginPath();ctx.moveTo(tx-6,ty-4);ctx.bezierCurveTo(tx-8,ty-16,tx+4,ty-20,tx,ty-24);ctx.bezierCurveTo(tx-4,ty-20,tx+8,ty-16,tx+6,ty-4);ctx.closePath();ctx.fill();
      ctx.fillStyle=`rgba(255,230,100,${flicker*.95})`;
      ctx.beginPath();ctx.moveTo(tx-3,ty-4);ctx.bezierCurveTo(tx-4,ty-14,tx+3,ty-16,tx,ty-18);ctx.bezierCurveTo(tx-3,ty-16,tx+4,ty-14,tx+3,ty-4);ctx.closePath();ctx.fill();
    }
    // Ground crystals
    for(let i=0;i<8;i++){
      const cx2=((i*600+150)-camX*.3)%(W+200)-50,cy_=H*.88-10;const pulse=(Math.sin(tick*.06+i)+1)*.5;
      ctx.fillStyle=`rgba(100,50,255,${.3+pulse*.4})`;ctx.beginPath();ctx.moveTo(cx2,cy_);ctx.lineTo(cx2-6,cy_+18);ctx.lineTo(cx2+6,cy_+18);ctx.fill();
    }
  }
}

  if(e.dead&&e.deadTimer>0){ctx.fillStyle='rgba(80,0,80,.5)';ctx.fillRect(e.x-cx,e.y,e.w,e.h);return;}if(e.dead)return;

  ctx.fillStyle='rgba(255,0,0,.5)';ctx.shadowColor='#ff0000';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(-3,-1,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3,-1,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  // Ears
  ctx.fillStyle='#1a0a2a';ctx.beginPath();ctx.moveTo(-4,-5);ctx.lineTo(-6,-10);ctx.lineTo(-1,-5);ctx.fill();ctx.beginPath();ctx.moveTo(4,-5);ctx.lineTo(6,-10);ctx.lineTo(1,-5);ctx.fill();
  ctx.restore();
}
function drawSpider(e,cx){

}

function drawShark(e,cx){

  ctx.fillStyle='#446688';ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(-40,-13);ctx.lineTo(-40,13);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(-6,-28);ctx.lineTo(12,-11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#aaccdd';ctx.beginPath();ctx.moveTo(-20,2);ctx.bezierCurveTo(-20,9,20,9,20,2);ctx.bezierCurveTo(20,-2,-20,-2,-20,2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(15,-3,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(16,-4,1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(12+i*4,9);ctx.lineTo(14+i*4,16);ctx.lineTo(16+i*4,9);ctx.fill();}

  ctx.fillStyle='#c8952a';ctx.fillRect(-13,-2,26,4);ctx.fillStyle='#ccc';ctx.fillRect(11,-3,6,6);

function drawPlayer(cx){
  const p=player;
  if(PU.invis>0&&Math.floor(tick/4)%3!==0)return;
  if(p.invincible>0&&Math.floor(p.invincible/4)%2===0)return;
  const px=Math.round(p.x-cx),py=Math.round(p.y);
  const fr=p.frame; // 0 or 1 walk frame
  const walk=p.onGround&&Math.abs(p.vx)>.5;
  const inAir=!p.onGround;

  ctx.save();
  if(p.facing===-1){ctx.translate(px+p.w,py);ctx.scale(-1,1);}else ctx.translate(px,py);

  // ── Ауру/захист ──
  if(PU.shield>0){ctx.strokeStyle='rgba(0,255,170,.65)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.w/2,p.h/2,p.w,0,Math.PI*2);ctx.stroke();}
  if(biome.water){ctx.strokeStyle='rgba(100,200,255,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.w/2,p.h/2,p.w*.7,0,Math.PI*2);ctx.stroke();}
  // Броня-щит аура
  if(armorShields>0){
    ctx.strokeStyle=`rgba(245,216,122,${.3+Math.sin(tick*.1)*.15})`;
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.w/2,p.h/2,p.w+3,0,Math.PI*2);ctx.stroke();
  }

  // ── Ноги (анімовані) ──
  const legColor=armor.chest?'#667799':'#6a5a8b';
  const bootColor=armor.chest?'#445577':'#3a3060';
  if(walk){
    // Права нога вперед / ліва назад (fr=0), потім навпаки (fr=1)
    const r0y=fr===0?4:0, r1y=fr===0?0:4;
    // Ліва нога
    ctx.fillStyle=legColor;ctx.fillRect(3,p.h-14+r0y,7,8);
    ctx.fillStyle=bootColor;ctx.fillRect(2,p.h-7+r0y,9,6);
    // Права нога
    ctx.fillStyle=legColor;ctx.fillRect(12,p.h-14+r1y,7,8);
    ctx.fillStyle=bootColor;ctx.fillRect(11,p.h-7+r1y,9,6);
  } else if(inAir){
    // В повітрі — ноги підтягнуті
    ctx.fillStyle=legColor;ctx.fillRect(3,p.h-12,7,7);ctx.fillRect(12,p.h-12,7,7);
    ctx.fillStyle=bootColor;ctx.fillRect(2,p.h-6,9,5);ctx.fillRect(11,p.h-6,9,5);
  } else {
    // Стоїть
    ctx.fillStyle=legColor;ctx.fillRect(3,p.h-14,7,9);ctx.fillRect(12,p.h-14,7,9);
    ctx.fillStyle=bootColor;ctx.fillRect(2,p.h-6,9,6);ctx.fillRect(11,p.h-6,9,6);
  }

  // ── Тіло ──
  const bodyColor=armor.chest?'#7788aa':'#5a4a7a';
  const bodyAccent=armor.chest?'#aabbdd':'#8a7aab';
  ctx.fillStyle=bodyColor;ctx.fillRect(1,p.h-28,20,15);
  if(armor.chest){
    // Нагрудник з деталями
    ctx.fillStyle='#8899bb';ctx.fillRect(1,p.h-28,20,15);
    ctx.fillStyle='#aabbdd';ctx.fillRect(3,p.h-26,16,2);// відблиск
    ctx.fillStyle='#6677aa';ctx.fillRect(1,p.h-20,20,2);// горизонтальна смуга
    ctx.fillStyle='#8899bb';ctx.fillRect(1,p.h-16,20,3);// пояс
    ctx.fillStyle='#ccddff';ctx.fillRect(9,p.h-26,4,6);// центральна накладка
  } else {
    // Звичайний одяг
    ctx.fillStyle=bodyAccent;ctx.fillRect(2,p.h-27,18,2);
    ctx.fillStyle='#8b6318';ctx.fillRect(1,p.h-15,20,3);// пояс
  }

  // ── Ліва рука (маховий рух при ході) ──
  const armColor=armor.chest?'#8899bb':'#5a4a7a';
  const handColor='#e8d5a3';
  if(!hasSword){
    // Ліва рука
    const laSwing=walk?(fr===0?-4:4):0;
    ctx.fillStyle=armColor;ctx.fillRect(-4,p.h-27+laSwing,5,10);
    ctx.fillStyle=handColor;ctx.fillRect(-5,p.h-18+laSwing,6,5);
    // Права рука
    const raSwing=walk?(fr===0?4:-4):0;
    ctx.fillStyle=armColor;ctx.fillRect(21,p.h-27+raSwing,5,10);
    ctx.fillStyle=handColor;ctx.fillRect(21,p.h-18+raSwing,6,5);
  } else {
    // Ліва рука без меча
    const laSwing=walk?(fr===0?-3:3):0;
    ctx.fillStyle=armColor;ctx.fillRect(-4,p.h-27+laSwing,5,10);
    ctx.fillStyle=handColor;ctx.fillRect(-5,p.h-18+laSwing,6,5);
    // Права рука з мечем малюється нижче разом із мечем
  }

  // ── Голова ──
  const skinColor='#e8d5a3';
  const hairColor='#f5a623';
  if(!armor.helmet){
    // Звичайна голова — обличчя + волосся
    ctx.fillStyle=skinColor;ctx.fillRect(3,p.h-42,16,14);
    ctx.fillStyle=hairColor;ctx.fillRect(2,p.h-44,18,6);
    ctx.fillRect(2,p.h-44,4,10);// ліве волосся
    // Очі
    ctx.fillStyle='#111';ctx.fillRect(6,p.h-37,3,3);ctx.fillRect(13,p.h-37,3,3);
    // Ніс
    ctx.fillStyle='#c8a070';ctx.fillRect(10,p.h-33,2,2);
    // Рот
    ctx.fillStyle='#a06040';ctx.fillRect(7,p.h-30,8,2);
  } else {
    // Шолом лицаря
    ctx.fillStyle='#c8a430';
    ctx.fillRect(1,p.h-44,20,16);  // основа шолома
    ctx.fillRect(0,p.h-40,22,10);  // розширення
    ctx.fillStyle='#a08020';
    ctx.fillRect(0,p.h-32,5,4);    // ліва щока
    ctx.fillRect(17,p.h-32,5,4);   // права щока
    ctx.fillStyle='#1a1008';
    ctx.fillRect(4,p.h-36,14,5);   // забрало (темна щілина)
    ctx.fillStyle='#f0c040';
    ctx.fillRect(1,p.h-44,20,3);   // золотий обідок
    ctx.fillRect(0,p.h-40,22,2);   // золота смуга
    // Очі крізь забрало (два маленьких вогники)
    ctx.fillStyle='rgba(255,200,50,.7)';
    ctx.fillRect(6,p.h-35,3,2);ctx.fillRect(13,p.h-35,3,2);
    // Плюм (перо на шоломі)
    ctx.fillStyle='#cc2244';
    ctx.fillRect(10,p.h-50,3,8);
    ctx.fillRect(8,p.h-52,7,4);
  }

  // ── Меч + права рука ──
  if(hasSword){
    ctx.save();
    const swing=swordSwing;
    const raSwing=walk?(fr===0?4:-4):0;

    if(swing>12){
      // Замах вгору — рука і меч над головою
      ctx.translate(p.w*.4,p.h-36);ctx.rotate(-1.3);
      ctx.fillStyle=armColor;ctx.fillRect(0,0,5,11);// плече
      ctx.fillStyle=handColor;ctx.fillRect(-1,10,6,5);
      ctx.translate(2,14);
    } else if(swing>6){
      // Удар вперед — рука витягнута
      ctx.translate(p.w+1,p.h-26);ctx.rotate(.15);
      ctx.fillStyle=armColor;ctx.fillRect(-3,-10,5,11);
      ctx.fillStyle=handColor;ctx.fillRect(-4,0,6,5);
      ctx.translate(0,4);
    } else if(swing>0){
      // Відведення — рука вниз
      ctx.translate(p.w*.9,p.h-18);ctx.rotate(.8);
      ctx.fillStyle=armColor;ctx.fillRect(-4,-10,5,10);
      ctx.fillStyle=handColor;ctx.fillRect(-4,-1,6,5);
      ctx.translate(0,4);
    } else {
      // Спокій / хода — права рука тримає меч збоку
      ctx.translate(p.w+1,p.h-26+raSwing);
      ctx.fillStyle=armColor;ctx.fillRect(-3,-10,5,11);
      ctx.fillStyle=handColor;ctx.fillRect(-4,0,6,5);
      ctx.translate(0,4);ctx.rotate(-.15);
    }

    // Меч
    ctx.fillStyle='#c0d8ff';ctx.fillRect(0,-2,24,4);   // клинок
    ctx.fillStyle='#e8e8ff';ctx.fillRect(16,-1,8,2);   // відблиск
    ctx.fillStyle='#aaa';ctx.fillRect(-5,-4,5,8);       // гарда
    ctx.fillStyle='#8b5e3c';ctx.fillRect(-13,-3,9,6);   // руків'я
    ctx.fillStyle='#c8a040';ctx.fillRect(-17,-3,5,6);   // навершя

    if(swing>0){
      const alpha=swing/18;
      ctx.fillStyle=`rgba(150,210,255,${alpha*.45})`;
      ctx.beginPath();ctx.arc(24,0,12+swing*.5,0,Math.PI*2);ctx.fill();
      // Слід меча
      ctx.strokeStyle=`rgba(200,230,255,${alpha*.6})`;
      ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(24,0);ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore();

  if(p.dead){ctx.fillStyle='rgba(255,50,0,.4)';ctx.fillRect(px-4,py-4,p.w+8,p.h+8);}
  if(window.godMode){ctx.fillStyle='rgba(255,200,0,.12)';ctx.fillRect(px-6,py-6,p.w+12,p.h+12);}
}
function drawSnow(cx){
  if(!biome.snow)return;ctx.fillStyle='rgba(220,240,255,.75)';
  for(const s of snowflakes){const sx=s.x-cx;if(sx<-5||sx>cv.width+5)continue;ctx.beginPath();ctx.arc(sx,s.y,s.r,0,Math.PI*2);ctx.fill();}
}
function drawLeaves(cx){
  if(biome.id!=='forest')return;
  for(const l of leaves){const lx=l.x-cx;if(lx<-10||lx>cv.width+10)continue;ctx.fillStyle=l.col;ctx.beginPath();ctx.arc(lx,l.y,l.r,0,Math.PI*2);ctx.fill();}
}
function drawSuctions(cx){
  if(!biome.water)return;ctx.strokeStyle='rgba(100,200,255,.45)';ctx.lineWidth=1.5;
  for(const b of bubbles){const bx=b.x-cx;if(bx<-10||bx>cv.width+10)continue;ctx.beginPath();ctx.arc(bx,b.y,b.r,0,Math.PI*2);ctx.stroke();}
}
function drawWaterOverlay(){
  const W=cv.width,H=cv.height;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,40,120,.3)');g.addColorStop(1,'rgba(0,20,80,.1)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){const yy=(tick*1.2+i*70)%H;ctx.fillStyle='rgba(0,150,255,.04)';ctx.fillRect(0,yy,W,8);}
}

function draw(){
  camX=getCamX();
  drawBg();
  drawSnow(camX);drawLeaves(camX);drawSuctions(camX);
  drawPlatforms(camX);drawSpikes(camX);drawCampfires(camX);
  for(const c of coins)drawCoin(c,camX);
  drawSwordItem(camX);
  drawBossLoot(camX);
  for(const pt of potions)drawAmphora(pt,camX);
  drawCaveEntrance(camX);
  drawDoor(camX);
  for(const e of enemies){
    if(e.type==='ptero')drawPtero(e,camX);
    if(e.type==='bat')drawBat(e,camX);
    if(e.type==='guard')drawGuard(e,camX);
    if(e.type==='spider')drawSpider(e,camX);
    if(e.type==='yeti')drawYeti(e,camX);
    if(e.type==='shark')drawShark(e,camX);
  }
  for(const pr of projectiles)drawProjectile(pr,camX);
  drawParticles(camX);
  drawBoss(camX);
  drawPlayer(camX);
  if(biome.water)drawWaterOverlay();
  drawMinimap();
}

function drawMinimap(){
  const mc=document.getElementById('minimap');
  if(!mc||mc.style.display==='none')return;
  const mw=mc.width,mh=mc.height;
  const mctx2=mc.getContext('2d');
  mctx2.clearRect(0,0,mw,mh);
  const scl=mw/LEVEL_W;
  const PH=cv.height-150;
  // Ground line
  mctx2.fillStyle='rgba(245,166,35,.25)';mctx2.fillRect(0,mh-3,mw,3);
  // Platforms
  mctx2.fillStyle='rgba(245,166,35,.35)';
  for(const p of platforms){if(!p.ground)mctx2.fillRect(p.x*scl,mh*.35,p.w*scl,2);}
  // Coins
  for(const c of coins){if(!c.collected){mctx2.fillStyle='#ffe066';mctx2.fillRect(c.x*scl-1,mh*.5,2,2);}}
  // Door
  if(doorObj){mctx2.fillStyle=doorObj.open?'#00ffaa':'#ff4444';mctx2.fillRect(doorObj.x*scl-1,mh*.2,3,mh*.6);}
  // Enemies
  mctx2.fillStyle='#ff4444';
  for(const e of enemies){if(!e.dead)mctx2.fillRect(e.x*scl-1,mh*.3,3,3);}
  // Player
  const px=player.x*scl;
  mctx2.fillStyle='#fff';mctx2.fillRect(px-2,mh*.2,4,mh*.6);
  // Frame glow around player position
  mctx2.strokeStyle='rgba(255,255,255,.4)';mctx2.lineWidth=1;
  mctx2.strokeRect(Math.max(0,px-12),0,24,mh);
}

// ══════════════ SWIPE GESTURES ════════════════
let swipeStartX=0,swipeStartY=0,swipeStartTime=0;
document.addEventListener('touchstart',e=>{
  if(GS!=='playing')return;
  const t=e.touches[0];
  swipeStartX=t.clientX;swipeStartY=t.clientY;swipeStartTime=Date.now();
},{passive:true});
document.addEventListener('touchend',e=>{
  if(GS!=='playing')return;
  const t=e.changedTouches[0];
  const dx=t.clientX-swipeStartX,dy=t.clientY-swipeStartY;
  const dt=Date.now()-swipeStartTime;
  if(dt>350)return; // too slow
  const absDx=Math.abs(dx),absDy=Math.abs(dy);
  // Only in the center zone (not over buttons)
  const cx=t.clientX,cy=t.clientY;
  const inButtonZone=cy>window.innerHeight-180;
  if(inButtonZone)return;
  if(absDy>40&&absDy>absDx*1.2){
    if(dy<0){// swipe up = jump
      keys.jump=true;jumpPressed=true;
      setTimeout(()=>{keys.jump=false;},100);
    } else if(dy>0&&biome.water){// swipe down in water = dive
      player.vy=2.5;
    }
  }
},{passive:true});

let difficulty='normal';
const DIFF={
  easy:  {enemyHpMult:0.7, enemySpeedMult:0.75, shootRate:1.6, startLives:5, scoreBonus:0.7},
  normal:{enemyHpMult:1.0, enemySpeedMult:1.0,  shootRate:1.0, startLives:3, scoreBonus:1.0},

};

// ══════════════ BOSS SYSTEM ═══════════════════
const BOSS_DEFS=[
  {id:'golem',   name:'💀 SAND GOLEM 💀',   col:'#c8a430',colDark:'#8a6818',hp:18,spd:1.2,w:52,h:70},
  {id:'colossus',name:'❄ ICE COLOSSUS ❄',  col:'#88ccff',colDark:'#3a7aaa',hp:22,spd:1.0,w:58,h:76},
  {id:'serpent', name:'🌊 SEA SERPENT 🌊',  col:'#22aaaa',colDark:'#116666',hp:20,spd:1.8,w:48,h:44},
  {id:'witch',   name:'🌲 FOREST WITCH 🌲', col:'#882288',colDark:'#441144',hp:16,spd:1.5,w:44,h:64},
];
let boss=null,isBossLevel=false;

function spawnBoss(){
  const bIdx=Math.floor((levelNum-1)/3-1)%BOSS_DEFS.length;
  const def=BOSS_DEFS[Math.max(0,bIdx)];
  const D=DIFF[difficulty];
  const gen=Math.floor((levelNum-1)/12);
  const PH=cv.height-150;
  boss={...def,
    x:LEVEL_W-600,y:PH-def.h-20,maxHp:Math.round(def.hp*D.enemyHpMult*(1+gen*.3)),
    hp:Math.round(def.hp*D.enemyHpMult*(1+gen*.3)),
    vx:def.spd*D.enemySpeedMult*(1+gen*.15),
    walkDir:-1,phase:0,attackTimer:140,dead:false,invincible:0};
  isBossLevel=true;doorObj.open=false;
  document.getElementById('bossHpBar').style.display='block';
  document.getElementById('bossName').textContent=def.name;
  updateBossHpBar();
  showCD('⚔ '+def.name+' ⚔');
}
function updateBossHpBar(){
  if(!boss)return;
  const pct=Math.max(0,boss.hp/boss.maxHp)*100;
  const f=document.getElementById('bossHpFill');
  f.style.width=pct+'%';
  f.style.background=pct>60?'linear-gradient(90deg,#ff2200,#ff6600)':pct>30?'linear-gradient(90deg,#ff8800,#ffaa00)':'#ff0000';
}
function updateBoss(){
  if(!boss||boss.dead)return;
  const p=player;const PH=cv.height-150;
  boss.phase+=.05;boss.invincible=Math.max(0,boss.invincible-1);
  const dx=p.x-(boss.x+boss.w/2);
  boss.walkDir=dx>0?1:-1;
  boss.x+=boss.vx*boss.walkDir;
  boss.x=Math.max(50,Math.min(LEVEL_W-boss.w-50,boss.x));
  boss.y=PH-boss.h-20;
  boss.attackTimer--;
  if(boss.attackTimer<=0){
    boss.attackTimer=Math.round(140*DIFF[difficulty].shootRate);
    const dist=Math.hypot(dx,p.y-boss.y)||1;
    const spd=boss.id==='serpent'?5.5:3.8;
    projectiles.push({x:boss.x+boss.w/2,y:boss.y+boss.h*.3,vx:(dx/dist)*spd,vy:((p.y-boss.y)/dist)*2.5,dead:false});
    if(boss.id==='golem')projectiles.push({x:boss.x+boss.w/2,y:boss.y+boss.h*.3,vx:(dx/dist)*spd*.6+1.5,vy:-2.2,dead:false});
  }
  // Sword hits boss
  if(hasSword&&swordSwing>0&&!swordHitBossThisSwing&&boss.invincible<=0){
    const reach=player.w+28;
    const sx=player.facing===1?player.x+player.w:player.x-reach;
    const hitBox={x:sx,y:player.y-4,w:reach,h:player.h+8};
    if(colRect(hitBox,{x:boss.x,y:boss.y,w:boss.w,h:boss.h})){
      swordHitBossThisSwing=true;
      boss.hp-=1;boss.invincible=22;
      spawnHitParticles(boss.x+boss.w/2,boss.y+boss.h/3);
      updateBossHpBar();
      if(boss.hp<=0){
        boss.dead=true;
        spawnEnemyParticles(boss.x+boss.w/2,boss.y+boss.h/2,boss.col);
        score+=Math.round(2000*DIFF[difficulty].scoreBonus);updateHUD();
        document.getElementById('bossHpBar').style.display='none';
        showCD('🏆 BOSS DEFEATED! +2000 🏆');
        // Лут залежно від прогресу
        let lootType;
        if(!armor.helmet) lootType='helmet';
        else if(!armor.chest) lootType='chest';
        else lootType='repair'; // вже в повній броні — ремонт щитів
        bossLoot={type:lootType,x:boss.x+boss.w/2-10,y:boss.y,vy:-4,collected:false};
        setTimeout(()=>{doorObj.open=true;isBossLevel=false;boss=null;},1400);
      }
    }
  }
  if(!window.godMode&&player.invincible<=0&&!player.dead&&PU.invis<=0){
    if(colRect(player,{x:boss.x,y:boss.y,w:boss.w,h:boss.h})){
      blockOrTakeHit(80);
    }
  }
}
function drawBoss(cx){
  if(!boss||boss.dead)return;
  const bx=boss.x-cx;if(boss.invincible>0&&tick%4<2)return;
  ctx.save();ctx.translate(bx+boss.w/2,boss.y+boss.h/2);
  const bob=Math.sin(boss.phase)*3;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,boss.h/2+5,boss.w*.55,7,0,0,Math.PI*2);ctx.fill();
  if(boss.id==='golem'){
    ctx.fillStyle=boss.colDark;ctx.fillRect(-26,-34+bob,52,68);
    ctx.fillStyle=boss.col;
    for(let i=0;i<5;i++)for(let j=0;j<4;j++){ctx.fillStyle=i%2?boss.col:boss.colDark;ctx.fillRect(-22+i*9,-30+j*14+bob,8,12);}
    ctx.fillStyle=boss.col;ctx.fillRect(-18,-60+bob,36,28);
    ctx.fillStyle='#ff4400';ctx.fillRect(-12,-52+bob,10,8);ctx.fillRect(3,-52+bob,10,8);
    ctx.fillStyle=boss.colDark;ctx.fillRect(-44,-20+bob,18,30);ctx.fillRect(26,-20+bob,18,30);
  } else if(boss.id==='colossus'){
    ctx.fillStyle=boss.colDark;ctx.fillRect(-28,-36+bob,56,72);
    ctx.fillStyle='rgba(180,240,255,.55)';
    [[-16,-26],[12,-22],[-4,-28],[16,-8],[-18,6]].forEach(([ix,iy])=>{ctx.beginPath();ctx.moveTo(ix,iy+bob);ctx.lineTo(ix+5,iy+14+bob);ctx.lineTo(ix+9,iy+bob);ctx.fill();});
    ctx.fillStyle=boss.col;ctx.fillRect(-20,-64+bob,40,30);
    ctx.fillStyle='#88ddff';ctx.fillRect(-14,-58+bob,10,8);ctx.fillRect(4,-58+bob,10,8);
    ctx.fillStyle=boss.colDark;ctx.fillRect(-38,-16+bob,14,36);ctx.fillRect(24,-16+bob,14,36);
  } else if(boss.id==='serpent'){
    for(let s=0;s<4;s++){const sx2=Math.sin(boss.phase+s*.8)*14;ctx.fillStyle=s%2?boss.col:boss.colDark;ctx.beginPath();ctx.ellipse(sx2,s*10-8,18,11,0,0,Math.PI*2);ctx.fill();}
    const hx=Math.sin(boss.phase)*16;
    ctx.fillStyle=boss.col;ctx.beginPath();ctx.ellipse(hx,-22,20,14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffff00';[hx-8,hx+8].forEach(ex=>{ctx.beginPath();ctx.arc(ex,-24,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ex,-24,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffff00';});
  } else if(boss.id==='witch'){
    ctx.fillStyle=boss.colDark;ctx.beginPath();ctx.moveTo(-22,28+bob);ctx.lineTo(-16,-24+bob);ctx.lineTo(0,-28+bob);ctx.lineTo(16,-24+bob);ctx.lineTo(22,28+bob);ctx.closePath();ctx.fill();
    ctx.fillStyle=boss.col;ctx.beginPath();ctx.moveTo(-16,28+bob);ctx.lineTo(-12,-22+bob);ctx.lineTo(0,-26+bob);ctx.lineTo(12,-22+bob);ctx.lineTo(16,28+bob);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d4a070';ctx.beginPath();ctx.ellipse(0,-30+bob,13,15,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#220022';ctx.beginPath();ctx.moveTo(-20,-38+bob);ctx.lineTo(20,-38+bob);ctx.lineTo(0,-66+bob);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff44ff';ctx.fillRect(-10,-54+bob,8,6);ctx.fillRect(2,-54+bob,8,6);
    ctx.fillStyle='#3a2a0a';ctx.fillRect(18,-20+bob,4,46);
    ctx.shadowColor='#ff00ff';ctx.shadowBlur=14;ctx.fillStyle='#cc00ff';ctx.beginPath();ctx.arc(20,-24+bob,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  // Boss HP bar on sprite
  const bw=boss.w+20;
  ctx.fillStyle='#300';ctx.fillRect(-bw/2,-boss.h/2-22,bw,8);
  ctx.fillStyle=boss.hp/boss.maxHp>.5?'#ff4400':'#ff0000';
  ctx.fillRect(-bw/2,-boss.h/2-22,bw*(boss.hp/boss.maxHp),8);
  ctx.restore();
}

function loop(){
  if(GS==='playing'){
    tick++;updatePlayer();updateEnemies();updateBoss();updateParticles();draw();
    if(leftPressTimer>0){leftPressTimer--;if(leftPressTimer<=0)leftPressCount=0;}
  }
  requestAnimationFrame(loop);
}

// ══════════════ POWERUP HUD ═══════════════════
function updatePUHUD(){
  const cfg={speed:{label:'SPD',color:'#ffaa00'},doubleJump:{label:'2×↑',color:'#00aaff'},shield:{label:'SHD',color:'#00ffaa'},invis:{label:'INV',color:'#cc88ff'}};
  document.getElementById('puHud').innerHTML=Object.entries(PU).filter(([,v])=>v>0).map(([k])=>`<div class="pub" style="color:${cfg[k].color};border-color:${cfg[k].color}">${cfg[k].label}</div>`).join('');
}

// ══════════════ INPUT ═════════════════════════
// ══════════════ CHEAT CODE - GOD MODE ════════
let leftPressCount=0,leftPressTimer=0;
document.addEventListener('keydown',e=>{
  if(GS!=='playing') return;
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' '){keys.jump=true;jumpPressed=true;}
  if(e.key==='z'||e.key==='x'){
    keys.attack=true;
    if(hasSword&&swordSwing===0){swordSwing=18;swordHitThisSwing=false;swordHitBossThisSwing=false;}
  }
  // God Mode cheat: ← pressed 8 times within 3 seconds
  if(e.key==='ArrowLeft'){
    leftPressCount++;leftPressTimer=180;
    if(leftPressCount>=8){
      leftPressCount=0;
      window.godMode=!window.godMode;
      showCD(window.godMode?'👑 GOD MODE ON 👑':'💀 GOD MODE OFF');
    }
  }
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.jump=false;
  if(e.key==='z'||e.key==='x')keys.attack=false;
});
function setupBtn(id,keyName,isJump){
  const el=document.getElementById(id);
  const press=()=>{
    if(GS!=='playing')return;
    if(isJump){keys.jump=true;jumpPressed=true;}else keys[keyName]=true;
    el.classList.add('pressed');
    if(navigator.vibrate&&isJump)navigator.vibrate(18);
  };
  const release=()=>{if(isJump)keys.jump=false;else keys[keyName]=false;el.classList.remove('pressed');};
  el.addEventListener('touchstart',e=>{e.preventDefault();press();
    if(id==='bL'){leftPressCount++;leftPressTimer=180;if(leftPressCount>=8){leftPressCount=0;window.godMode=!window.godMode;showCD(window.godMode?'👑 GOD MODE ON 👑':'💀 GOD MODE OFF');}}
  },{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
  el.addEventListener('mousedown',press);el.addEventListener('mouseup',release);el.addEventListener('mouseleave',release);
}
setupBtn('bL','left',false);setupBtn('bR','right',false);setupBtn('bJ','jump',true);
// Attack button - trigger sword swing
// Attack button – short tap = one swing; hold = continuous attacks
document.getElementById('bA').addEventListener('touchstart',e=>{
  e.preventDefault();
  if(GS!=='playing')return;
  keys.attack=true;
  if(hasSword&&swordSwing===0){swordSwing=18;swordHitThisSwing=false;swordHitBossThisSwing=false;}
},{passive:false});
document.getElementById('bA').addEventListener('touchend',e=>{
  e.preventDefault();keys.attack=false;
},{passive:false});
document.getElementById('bA').addEventListener('touchcancel',e=>{
  e.preventDefault();keys.attack=false;
},{passive:false});
document.getElementById('bA').addEventListener('mousedown',()=>{
  if(GS!=='playing')return;
  keys.attack=true;
  if(hasSword&&swordSwing===0){swordSwing=18;swordHitThisSwing=false;swordHitBossThisSwing=false;}
});
document.addEventListener('mouseup',()=>{keys.attack=false;});

// FIXED: Bidirectional cave logic safely teleports to surface entrance coordinates
const triggerCaveTransition = () => {
  if(!nearCave)return;
  if(!inCaveLevel) {
    preCaveBiome = biome.id;
    saveSurfaceState();
    SFX.cave();showCD(T('enterCave'));
    document.getElementById('caveBtn').style.display='none';
    setTimeout(()=>{
      inCaveLevel=true;
      genLevel('cave');
      // Явно відновлюємо AudioContext і запускаємо музику печери
      if(AC&&AC.state==='suspended')AC.resume();
      stopMusic();
      _currentLevelTrack=CAVE_TRACK;
      startMusic();
    },400);
  } else {
    SFX.cave();showCD(T('exitCave'));
    document.getElementById('caveBtn').style.display='none';
    setTimeout(()=>{
      const saved=preCaveBiome;
      if(!restoreSurfaceState()){
        inCaveLevel=false;preCaveBiome=null;genLevel(saved||'desert',true);
      }
      if(AC&&AC.state==='suspended')AC.resume();
      pickRandomLevelTrack();
      startMusic();
    },400);
  }
};
document.getElementById('caveBtn').addEventListener('click', triggerCaveTransition);
document.getElementById('caveBtn').addEventListener('touchstart', e=>{e.preventDefault(); triggerCaveTransition();},{passive:false});

document.getElementById('exitGameBtn').addEventListener('click', ()=>{
  if(GS==='playing') {
    GS='paused';
    document.getElementById('confirmOverlay').style.display='flex';
  }
});

document.getElementById('confirmYes').addEventListener('click', ()=>{
  document.getElementById('confirmOverlay').style.display='none';
  showMenu();
});

document.getElementById('confirmNo').addEventListener('click', ()=>{
  document.getElementById('confirmOverlay').style.display='none';

  ac();
  const D=DIFF[difficulty];
  lives=D.startLives;maxLives=D.startLives;score=0;levelNum=1;window.godMode=false;
  combo=0;livesAtLevelStart=D.startLives;

  drawMenuArt();
  // show difficulty selector
  document.getElementById('diffPanel').style.display='flex';
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',startGame);

applyLang();
loop();
